<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Фотостудия капибары</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:
    radial-gradient(
      circle at 50% 25%,
      #fff8eb 0%,
      #f0ddc2 56%,
      #d8b98f 100%
    );
}

.game{
  position:relative;
  width:100vw;
  height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.darkness{
  position:absolute;
  inset:0;

  z-index:30;

  background:
    rgba(8,10,14,0.94);

  pointer-events:none;

  transition:
    opacity 1.4s ease;
}

.darkness.off{
  opacity:0;
}

.instruction{
  position:absolute;

  left:50%;
  top:28px;

  z-index:60;

  transform:
    translateX(-50%);

  padding:
    12px 22px;

  border-radius:18px;

  background:
    rgba(255,255,255,0.94);

  color:#6d4d31;

  font-size:
    clamp(18px,2vw,28px);

  font-weight:800;

  text-align:center;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,0.16);

  transition:
    opacity .4s ease,
    transform .4s ease;
}

.instruction.hide{
  opacity:0;

  transform:
    translateX(-50%)
    translateY(-10px);

  pointer-events:none;
}

/* ========================
   ВЫКЛЮЧАТЕЛЬ
======================== */

.switch-wrap{
  position:absolute;

  right:40px;
  top:50%;

  transform:
    translateY(-50%);

  z-index:70;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:8px;
}

.switch-label{
  color:#fff;

  font-size:15px;

  text-shadow:
    0 2px 5px
    rgba(0,0,0,.7);
}

.light-switch{
  position:relative;

  width:72px;
  height:108px;

  border:0;

  border-radius:12px;

  background:#eee8dc;

  cursor:pointer;

  box-shadow:
    0 8px 22px
    rgba(0,0,0,.4),
    inset 0 0 0 2px
    rgba(90,80,65,.12);
}

.switch-button{
  position:absolute;

  left:17px;
  top:16px;

  width:38px;
  height:75px;

  border-radius:6px;

  background:
    linear-gradient(
      180deg,
      #faf8f1,
      #cbc4b7
    );

  box-shadow:
    0 4px 8px
    rgba(0,0,0,.28);

  transition:
    transform .3s ease,
    background .3s ease;
}

.light-switch.on .switch-button{
  transform:
    translateY(12px);

  background:
    linear-gradient(
      180deg,
      #ffe8a5,
      #e6ba52
    );
}

/* ========================
   ФОТО
======================== */

.photo-card{
  position:relative;

  width:
    min(70vw,820px);

  aspect-ratio:4/3;

  padding:
    14px 14px 48px;

  background:#fff;

  border-radius:10px;

  box-shadow:
    0 25px 65px
    rgba(78,49,24,.26);

  opacity:0;

  transform:
    scale(.96)
    rotate(-.5deg);

  transition:
    opacity .8s ease,
    transform .8s ease;
}

.photo-card.visible{
  opacity:1;

  transform:
    scale(1)
    rotate(-.5deg);
}

.photo-area{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  border-radius:4px;

  background:#eadcc8;

  touch-action:none;
}

.photo{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  pointer-events:none;
  user-select:none;

  filter:
    grayscale(.78)
    sepia(.28)
    blur(8px)
    brightness(1.4)
    contrast(.72)
    saturate(.35);

  opacity:.64;

  transform:
    scale(1.03);

  transition:
    filter 2.2s cubic-bezier(.22,.8,.3,1),
    opacity 2.2s ease,
    transform 2.2s cubic-bezier(.22,.8,.3,1);
}

.photo.developed{
  filter:
    grayscale(0)
    sepia(0)
    blur(0)
    brightness(1)
    contrast(1)
    saturate(1);

  opacity:1;

  transform:
    scale(1);
}

/* ========================
   ВЛАЖНЫЕ СЛЕДЫ
======================== */

#liquidCanvas{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  pointer-events:none;
}

/* ========================
   КИСТОЧКА + БАНОЧКА
======================== */

.tools{
  position:absolute;

  left:35px;
  bottom:35px;

  z-index:50;

  display:flex;
  align-items:flex-end;

  gap:20px;

  opacity:0;

  pointer-events:none;

  transform:
    translateY(15px);

  transition:
    opacity .45s ease,
    transform .45s ease;
}

.tools.show{
  opacity:1;

  transform:
    translateY(0);
}

.jar{
  width:88px;

  padding:
    11px 9px 13px;

  border-radius:
    8px 8px 14px 14px;

  background:
    linear-gradient(
      180deg,
      #f7eac5,
      #d9b86d
    );

  border:
    3px solid
    rgba(105,73,37,.35);

  color:#6c4a29;

  text-align:center;

  font-weight:800;

  box-shadow:
    0 8px 18px
    rgba(69,45,20,.2);
}

.jar::before{
  content:"";

  display:block;

  width:64px;
  height:12px;

  margin:
    -20px auto
    10px;

  border-radius:5px;

  background:#856542;
}

.jar-small{
  margin-top:4px;

  font-size:11px;

  opacity:.7;
}

.brush{
  position:relative;

  width:110px;
  height:48px;

  pointer-events:auto;

  cursor:grab;

  touch-action:none;

  transform:
    rotate(-18deg);

  transition:
    opacity .35s ease;
}

.brush:active{
  cursor:grabbing;
}

.brush-handle{
  position:absolute;

  right:0;
  top:17px;

  width:78px;
  height:14px;

  border-radius:999px;

  background:
    linear-gradient(
      180deg,
      #9b663c,
      #704326
    );

  box-shadow:
    inset 0 2px 3px
    rgba(255,255,255,.2);
}

.brush-metal{
  position:absolute;

  left:23px;
  top:13px;

  width:32px;
  height:23px;

  border-radius:4px;

  background:
    linear-gradient(
      90deg,
      #a69b8c,
      #ded8ce,
      #95897b
    );
}

.brush-bristles{
  position:absolute;

  left:0;
  top:10px;

  width:32px;
  height:29px;

  border-radius:
    14px 4px 4px 14px;

  background:
    linear-gradient(
      90deg,
      #ebcc8c,
      #c58f51
    );
}

/* ========================
   ВСПЫШКА
======================== */

.flash{
  position:absolute;
  inset:0;

  z-index:15;

  background:
    rgba(255,249,220,0);

  pointer-events:none;
}

.flash.active{
  animation:
    flashAnim .85s ease;
}

@keyframes flashAnim{
  0%{
    background:
      rgba(255,249,220,0);
  }

  35%{
    background:
      rgba(255,249,220,.72);
  }

  100%{
    background:
      rgba(255,249,220,0);
  }
}

/* ========================
   ФИНАЛ
======================== */

.success{
  position:absolute;

  left:50%;
  top:50%;

  z-index:80;

  transform:
    translate(-50%,-50%)
    scale(.8);

  padding:
    17px 28px;

  border-radius:20px;

  background:
    rgba(255,255,255,.96);

  color:#704b28;

  font-size:
    clamp(23px,3vw,38px);

  font-weight:800;

  box-shadow:
    0 14px 42px
    rgba(0,0,0,.22);

  opacity:0;

  pointer-events:none;

  transition:
    opacity .4s ease,
    transform .4s ease;
}

.success.show{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1);
}

@media(max-width:700px){
  .switch-wrap{
    right:14px;
  }

  .photo-card{
    width:86vw;
  }

  .tools{
    left:14px;
    bottom:16px;

    transform:
      scale(.85);
  }
}

</style>
</head>

<body>

<div class="game">

  <div
    class="instruction"
    id="instruction"
  >
    Включи свет 💡
  </div>

  <div
    class="darkness"
    id="darkness"
  ></div>

  <div
    class="switch-wrap"
    id="switchWrap"
  >

    <div class="switch-label">
      Свет
    </div>

    <button
      class="light-switch"
      id="lightSwitch"
    >
      <span
        class="switch-button"
      ></span>
    </button>

  </div>

  <div
    class="photo-card"
    id="photoCard"
  >

    <div
      class="photo-area"
      id="photoArea"
    >

      <img
        id="photo"
        class="photo"
        src="https://picsum.photos/id/1025/1200/900"
        alt=""
        draggable="false"
      >

      <canvas
        id="liquidCanvas"
      ></canvas>

      <div
        class="flash"
        id="flash"
      ></div>

    </div>

  </div>

  <div
    class="tools"
    id="tools"
  >

    <div class="jar">
      ПРОЯВИТЕЛЬ
      <div class="jar-small">
        фотораствор
      </div>
    </div>

    <div
      class="brush"
      id="brush"
    >

      <div
        class="brush-bristles"
      ></div>

      <div
        class="brush-metal"
      ></div>

      <div
        class="brush-handle"
      ></div>

    </div>

  </div>

  <div
    class="success"
    id="success"
  >
    ✨ Фотография готова! ✨
  </div>

</div>

<script>

const lightSwitch =
  document.getElementById(
    "lightSwitch"
  );

const darkness =
  document.getElementById(
    "darkness"
  );

const instruction =
  document.getElementById(
    "instruction"
  );

const switchWrap =
  document.getElementById(
    "switchWrap"
  );

const photoCard =
  document.getElementById(
    "photoCard"
  );

const photoArea =
  document.getElementById(
    "photoArea"
  );

const photo =
  document.getElementById(
    "photo"
  );

const tools =
  document.getElementById(
    "tools"
  );

const brush =
  document.getElementById(
    "brush"
  );

const canvas =
  document.getElementById(
    "liquidCanvas"
  );

const ctx =
  canvas.getContext("2d");

const flash =
  document.getElementById(
    "flash"
  );

const success =
  document.getElementById(
    "success"
  );


/* ==========================
   ЭТАПЫ
==========================

   dark
   brush
   ready
   developed

========================== */

let stage = "dark";

let W = 1;
let H = 1;
let DPR = 1;


/*
  Сколько реальных движений кистью
  нужно сделать.

  Не нужно мазать всю фотографию.
*/

const REQUIRED_BRUSH_DISTANCE = 430;

let brushedDistance = 0;


/* ==========================
   CANVAS
========================== */

function resizeCanvas(){

  const rect =
    photoArea.getBoundingClientRect();

  W = rect.width;
  H = rect.height;

  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.round(
      W * DPR
    );

  canvas.height =
    Math.round(
      H * DPR
    );

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );
}


/* ==========================
   ИНСТРУКЦИЯ
========================== */

function changeInstruction(text){

  instruction.classList.add(
    "hide"
  );

  setTimeout(
    () => {

      instruction.textContent =
        text;

      instruction.classList.remove(
        "hide"
      );

    },
    300
  );
}


/* ==========================
   СВЕТ
========================== */

lightSwitch.addEventListener(
  "click",
  () => {

    if(stage !== "dark") return;

    stage = "brush";

    lightSwitch.classList.add(
      "on"
    );

    darkness.classList.add(
      "off"
    );

    instruction.classList.add(
      "hide"
    );


    setTimeout(
      () => {

        photoCard.classList.add(
          "visible"
        );

      },
      450
    );


    setTimeout(
      () => {

        tools.classList.add(
          "show"
        );

        tools.style.pointerEvents =
          "auto";

        changeInstruction(
          "Нанеси проявитель на фотографию кисточкой 🖌️"
        );

      },
      1100
    );


    setTimeout(
      () => {

        switchWrap.style.opacity =
          ".35";

      },
      1300
    );

  }
);


/* ==========================
   КИСТОЧКА
========================== */

let dragging = false;

let brushX = 0;
let brushY = 0;

let previousX = null;
let previousY = null;


/*
  Запоминаем исходное положение,
  чтобы потом кисть можно было вернуть.
*/

let homeLeft = 0;
let homeTop = 0;


function localPhotoPosition(
  clientX,
  clientY
){

  const rect =
    photoArea.getBoundingClientRect();

  return {
    x:
      clientX -
      rect.left,

    y:
      clientY -
      rect.top,

    inside:
      clientX >= rect.left &&
      clientX <= rect.right &&
      clientY >= rect.top &&
      clientY <= rect.bottom
  };
}


/* ==========================
   РИСУЕМ ЖИДКОСТЬ
========================== */

function paintLiquid(x,y){

  /*
    Не краска.

    Очень лёгкий влажный
    янтарно-золотистый блеск.
  */

  const radius = 34;

  const gradient =
    ctx.createRadialGradient(
      x,
      y,
      0,

      x,
      y,
      radius
    );

  gradient.addColorStop(
    0,
    "rgba(255,236,174,.24)"
  );

  gradient.addColorStop(
    .40,
    "rgba(239,194,104,.16)"
  );

  gradient.addColorStop(
    .78,
    "rgba(255,245,214,.08)"
  );

  gradient.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );


  ctx.fillStyle =
    gradient;

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    radius,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    Маленький световой блик —
    эффект влажной поверхности.
  */

  ctx.fillStyle =
    "rgba(255,255,255,.12)";

  ctx.beginPath();

  ctx.ellipse(
    x - 8,
    y - 8,
    14,
    4,
    -.4,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* ==========================
   НАЧАЛО DRAG
========================== */

brush.addEventListener(
  "pointerdown",
  e => {

    if(stage !== "brush") return;

    e.preventDefault();

    dragging = true;

    brush.setPointerCapture(
      e.pointerId
    );

    const rect =
      brush.getBoundingClientRect();

    homeLeft =
      brush.offsetLeft;

    homeTop =
      brush.offsetTop;

    previousX =
      e.clientX;

    previousY =
      e.clientY;

    brush.style.position =
      "fixed";

    brush.style.left =
      rect.left + "px";

    brush.style.top =
      rect.top + "px";

    brush.style.zIndex =
      "100";

  }
);


/* ==========================
   ДВИГАЕМ КИСТЬ
========================== */

brush.addEventListener(
  "pointermove",
  e => {

    if(
      !dragging ||
      stage !== "brush"
    ) return;


    const rect =
      brush.getBoundingClientRect();


    const newLeft =
      e.clientX -
      rect.width * .48;

    const newTop =
      e.clientY -
      rect.height * .48;


    brush.style.left =
      newLeft + "px";

    brush.style.top =
      newTop + "px";


    const p =
      localPhotoPosition(
        e.clientX,
        e.clientY
      );


    if(p.inside){

      paintLiquid(
        p.x,
        p.y
      );


      if(
        previousX !== null
      ){

        const dx =
          e.clientX -
          previousX;

        const dy =
          e.clientY -
          previousY;

        brushedDistance +=
          Math.sqrt(
            dx*dx +
            dy*dy
          );

      }


      if(
        brushedDistance >=
        REQUIRED_BRUSH_DISTANCE
      ){

        finishBrushStage();

      }

    }


    previousX =
      e.clientX;

    previousY =
      e.clientY;

  }
);


/* ==========================
   ОТПУСТИЛИ КИСТЬ
========================== */

brush.addEventListener(
  "pointerup",
  () => {

    dragging = false;

    previousX = null;
    previousY = null;

  }
);


brush.addEventListener(
  "pointercancel",
  () => {

    dragging = false;

    previousX = null;
    previousY = null;

  }
);


/* ==========================
   ПРОЯВИТЕЛЬ НАНЕСЁН
========================== */

function finishBrushStage(){

  if(stage !== "brush") return;

  stage = "ready";

  dragging = false;

  brush.style.opacity =
    ".35";

  brush.style.pointerEvents =
    "none";


  changeInstruction(
    "Готово! Теперь нажми на фотографию 📸"
  );


  /*
    Жидкость чуть-чуть
    равномерно растекается.
  */

  canvas.style.transition =
    "filter .8s ease";

  canvas.style.filter =
    "blur(2px)";

}


/* ==========================
   ПРОЯВЛЕНИЕ
========================== */

photoCard.addEventListener(
  "click",
  () => {

    if(stage !== "ready") return;

    stage = "developed";

    instruction.classList.add(
      "hide"
    );

    tools.classList.remove(
      "show"
    );


    /*
      Следы проявителя растворяются.
    */

    canvas.style.transition =
      "opacity 1.4s ease";

    canvas.style.opacity =
      "0";


    /*
      Небольшая вспышка.
    */

    flash.classList.remove(
      "active"
    );

    void flash.offsetWidth;

    flash.classList.add(
      "active"
    );


    /*
      Снимок проявляется.
    */

    photo.classList.add(
      "developed"
    );


    setTimeout(
      () => {

        success.classList.add(
          "show"
        );

      },
      1900
    );


    setTimeout(
      () => {

        success.classList.remove(
          "show"
        );

      },
      3800
    );

  }
);


/* ==========================
   START
========================== */

window.addEventListener(
  "load",
  resizeCanvas
);


if(window.ResizeObserver){

  new ResizeObserver(
    resizeCanvas
  ).observe(photoArea);

}

</script>

</body>
</html>
