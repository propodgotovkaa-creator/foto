<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Фотостудия капибары</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Arial, Helvetica, sans-serif;
}


/* =========================
   ВСЯ ИГРА
========================= */

.game {
  position: relative;
  width: 100vw;
  height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 30%,
      #fff8e9 0%,
      #f1dcc0 55%,
      #d7b68c 100%
    );
}


/* =========================
   ЗАТЕМНЕНИЕ
========================= */

.darkness {
  position: absolute;
  inset: 0;

  z-index: 20;

  background:
    rgba(9, 11, 15, 0.93);

  transition:
    opacity 1.5s ease;

  pointer-events: none;
}

.darkness.light-on {
  opacity: 0;
}


/* =========================
   ИНСТРУКЦИЯ
========================= */

.instruction {
  position: absolute;
  top: 35px;
  left: 50%;

  z-index: 40;

  transform:
    translateX(-50%);

  padding:
    12px 22px;

  border-radius: 18px;

  background:
    rgba(255,255,255,0.92);

  color:
    #6f5036;

  font-size:
    clamp(18px, 2vw, 28px);

  font-weight: 700;

  text-align: center;

  box-shadow:
    0 8px 26px
    rgba(0,0,0,0.18);

  transition:
    opacity 0.45s ease,
    transform 0.45s ease;
}

.instruction.hide {
  opacity: 0;

  transform:
    translateX(-50%)
    translateY(-10px);

  pointer-events: none;
}


/* =========================
   ВЫКЛЮЧАТЕЛЬ
========================= */

.switch-wrap {
  position: absolute;

  right: 45px;
  top: 50%;

  z-index: 50;

  transform:
    translateY(-50%);

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 10px;
}


.switch-label {
  color: white;

  font-size: 15px;

  text-shadow:
    0 2px 5px
    rgba(0,0,0,0.7);
}


.switch {
  position: relative;

  width: 74px;
  height: 112px;

  border: 0;

  border-radius: 12px;

  background:
    #eee8dd;

  box-shadow:
    0 7px 20px
    rgba(0,0,0,0.42),
    inset 0 0 0 2px
    rgba(80,70,60,0.15);

  cursor: pointer;

  transition:
    transform 0.15s ease;
}

.switch:active {
  transform:
    scale(0.96);
}


.switch-button {
  position: absolute;

  left: 17px;
  top: 17px;

  width: 40px;
  height: 78px;

  border-radius: 6px;

  background:
    linear-gradient(
      180deg,
      #faf7ef,
      #cfc8bb
    );

  box-shadow:
    0 4px 8px
    rgba(0,0,0,0.30);

  transition:
    transform 0.35s ease,
    background 0.35s ease;
}


.switch.on .switch-button {
  transform:
    translateY(12px);

  background:
    linear-gradient(
      180deg,
      #ffe49e,
      #e8bd54
    );
}


/* =========================
   ФОТОГРАФИЯ
========================= */

.photo-card {
  position: relative;

  width:
    min(70vw, 820px);

  aspect-ratio:
    4 / 3;

  padding:
    14px 14px 48px;

  background:
    #fff;

  border-radius:
    10px;

  box-shadow:
    0 25px 65px
    rgba(76,49,23,0.27);

  transform:
    rotate(-0.6deg);

  cursor: pointer;

  opacity: 0;

  transition:
    opacity 0.9s ease,
    transform 0.9s ease;
}


.photo-card.visible {
  opacity: 1;

  transform:
    rotate(-0.6deg)
    scale(1);
}


.photo-area {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius:
    4px;

  background:
    #eee2d3;
}


.photo {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;

  user-select: none;

  pointer-events: none;

  /* НЕПРОЯВЛЕННОЕ состояние */

  filter:
    grayscale(0.75)
    sepia(0.35)
    blur(9px)
    brightness(1.45)
    contrast(0.68)
    saturate(0.35);

  opacity:
    0.62;

  transform:
    scale(1.035);

  transition:
    filter 2.2s cubic-bezier(.22,.8,.3,1),
    opacity 2.2s ease,
    transform 2.2s cubic-bezier(.22,.8,.3,1);
}


/* ПРОЯВИЛАСЬ */

.photo.developed {
  filter:
    grayscale(0)
    sepia(0)
    blur(0)
    brightness(1)
    contrast(1)
    saturate(1);

  opacity: 1;

  transform:
    scale(1);
}


/* =========================
   БЕЛАЯ ВСПЫШКА
========================= */

.flash {
  position: absolute;
  inset: 0;

  z-index: 12;

  background:
    rgba(255,249,218,0);

  pointer-events: none;
}


.flash.active {
  animation:
    flash 0.8s ease;
}


@keyframes flash {

  0% {
    background:
      rgba(255,250,220,0);
  }

  35% {
    background:
      rgba(255,250,220,0.75);
  }

  100% {
    background:
      rgba(255,250,220,0);
  }

}


/* =========================
   ПОДСКАЗКА НА ФОТО
========================= */

.photo-hint {
  position: absolute;

  left: 50%;
  bottom: 15px;

  z-index: 10;

  transform:
    translateX(-50%);

  padding:
    9px 16px;

  border-radius:
    999px;

  background:
    rgba(255,255,255,0.90);

  color:
    #755333;

  font-size:
    clamp(14px,1.4vw,19px);

  font-weight:
    700;

  white-space:
    nowrap;

  box-shadow:
    0 5px 16px
    rgba(0,0,0,0.12);

  opacity: 0;

  transition:
    opacity 0.5s ease;
}


.photo-hint.show {
  opacity: 1;
}


/* =========================
   ФИНАЛ
========================= */

.success {
  position: absolute;

  left: 50%;
  top: 50%;

  z-index: 60;

  transform:
    translate(-50%,-50%)
    scale(0.75);

  padding:
    18px 30px;

  border-radius:
    20px;

  background:
    rgba(255,255,255,0.96);

  color:
    #704b28;

  font-size:
    clamp(24px,3vw,40px);

  font-weight:
    800;

  box-shadow:
    0 14px 45px
    rgba(0,0,0,0.24);

  opacity: 0;

  pointer-events: none;

  transition:
    opacity 0.45s ease,
    transform 0.45s ease;
}


.success.show {
  opacity: 1;

  transform:
    translate(-50%,-50%)
    scale(1);
}


/* =========================
   МОБИЛЬНОЕ
========================= */

@media (max-width: 700px) {

  .switch-wrap {
    right: 16px;
  }

  .switch {
    width: 60px;
    height: 90px;
  }

  .switch-button {
    left: 14px;
    top: 14px;

    width: 32px;
    height: 62px;
  }

  .photo-card {
    width: 86vw;
  }

}

</style>
</head>


<body>

<div class="game">


  <div
    class="instruction"
    id="instruction"
  >
    Включи свет 💡
  </div>


  <div
    class="darkness"
    id="darkness"
  ></div>


  <div
    class="switch-wrap"
    id="switchWrap"
  >

    <div class="switch-label">
      Свет
    </div>


    <button
      class="switch"
      id="lightSwitch"
      aria-label="Включить свет"
    >

      <span
        class="switch-button"
      ></span>

    </button>

  </div>


  <div
    class="photo-card"
    id="photoCard"
  >

    <div class="photo-area">

      <!--
        ВРЕМЕННАЯ КАРТИНКА.
        Потом заменим на капибару.
      -->

      <img
        class="photo"
        id="photo"
        src="https://picsum.photos/id/1025/1200/900"
        alt=""
        draggable="false"
      >


      <div
        class="flash"
        id="flash"
      ></div>


      <div
        class="photo-hint"
        id="photoHint"
      >
        Нажми на фотографию ✨
      </div>

    </div>

  </div>


  <div
    class="success"
    id="success"
  >
    ✨ Фотография проявилась! ✨
  </div>


</div>


<script>

const lightSwitch =
  document.getElementById(
    "lightSwitch"
  );

const darkness =
  document.getElementById(
    "darkness"
  );

const instruction =
  document.getElementById(
    "instruction"
  );

const photoCard =
  document.getElementById(
    "photoCard"
  );

const photo =
  document.getElementById(
    "photo"
  );

const photoHint =
  document.getElementById(
    "photoHint"
  );

const flash =
  document.getElementById(
    "flash"
  );

const success =
  document.getElementById(
    "success"
  );


let lightIsOn = false;
let photoDeveloped = false;


/* ==========================
   ВКЛЮЧАЕМ СВЕТ
========================== */

lightSwitch.addEventListener(
  "click",
  () => {

    if (lightIsOn) return;

    lightIsOn = true;


    lightSwitch.classList.add(
      "on"
    );


    darkness.classList.add(
      "light-on"
    );


    instruction.classList.add(
      "hide"
    );


    /*
      Фотография появляется
      немного позже света.
    */

    setTimeout(
      () => {

        photoCard.classList.add(
          "visible"
        );

      },
      550
    );


    /*
      Затем появляется новая подсказка.
    */

    setTimeout(
      () => {

        instruction.textContent =
          "Теперь прояви фотографию 📸";


        instruction.classList.remove(
          "hide"
        );


        photoHint.classList.add(
          "show"
        );

      },
      1300
    );

  }
);


/* ==========================
   ПРОЯВЛЯЕМ ФОТОГРАФИЮ
========================== */

photoCard.addEventListener(
  "click",
  () => {

    if (
      !lightIsOn ||
      photoDeveloped
    ) return;


    photoDeveloped = true;


    photoHint.classList.remove(
      "show"
    );


    instruction.classList.add(
      "hide"
    );


    /*
      Мягкая вспышка.
    */

    flash.classList.remove(
      "active"
    );


    void flash.offsetWidth;


    flash.classList.add(
      "active"
    );


    /*
      Фотография плавно получает:
      цвет,
      резкость,
      контраст.
    */

    photo.classList.add(
      "developed"
    );


    /*
      Финальная надпись появляется
      после завершения проявления.
    */

    setTimeout(
      () => {

        success.classList.add(
          "show"
        );

      },
      1900
    );


    setTimeout(
      () => {

        success.classList.remove(
          "show"
        );

      },
      3900
    );

  }
);

</script>

</body>
</html>
