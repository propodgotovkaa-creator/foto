<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Фотостудия капибары</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#1d1712;
}


/* =========================
   ВСЯ ИГРА
========================= */

.game{
  position:relative;

  width:100vw;
  height:100vh;

  overflow:hidden;

  background-image:url("Fon.PNG");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}


/* =========================
   ТЕМНОТА
========================= */

.darkness{
  position:absolute;
  inset:0;

  z-index:80;

  background:
    rgba(6,7,9,0.92);

  pointer-events:none;

  transition:
    opacity 1.25s ease;
}

.darkness.off{
  opacity:0;
}


/* =========================
   ИНСТРУКЦИЯ
========================= */

.instruction{
  position:absolute;

  left:50%;
  top:28px;

  z-index:140;

  transform:
    translateX(-50%);

  max-width:min(80vw,760px);

  padding:
    13px 24px;

  border-radius:20px;

  background:
    rgba(255,250,239,0.95);

  color:#5d4029;

  font-size:
    clamp(17px,1.9vw,27px);

  font-weight:800;

  text-align:center;

  box-shadow:
    0 8px 28px
    rgba(52,31,14,0.22);

  transition:
    opacity .35s ease,
    transform .35s ease;
}

.instruction.hide{
  opacity:0;

  transform:
    translateX(-50%)
    translateY(-8px);
}


/* =========================
   ВЫКЛЮЧАТЕЛЬ
========================= */

.switch-wrap{
  position:absolute;

  right:45px;
  top:50%;

  z-index:150;

  transform:
    translateY(-50%);

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:8px;

  transition:
    opacity .45s ease;
}

.switch-label{
  color:#fff;

  font-size:15px;

  text-shadow:
    0 2px 6px
    rgba(0,0,0,.8);
}

.light-switch{
  position:relative;

  width:72px;
  height:108px;

  border:0;

  border-radius:12px;

  background:#eee8dc;

  cursor:pointer;

  box-shadow:
    0 8px 22px
    rgba(0,0,0,.42),
    inset 0 0 0 2px
    rgba(90,80,65,.12);
}

.switch-button{
  position:absolute;

  left:17px;
  top:16px;

  width:38px;
  height:75px;

  border-radius:6px;

  background:
    linear-gradient(
      180deg,
      #faf8f1,
      #cbc4b7
    );

  box-shadow:
    0 4px 8px
    rgba(0,0,0,.28);

  transition:
    transform .3s ease,
    background .3s ease;
}

.light-switch.on .switch-button{
  transform:
    translateY(12px);

  background:
    linear-gradient(
      180deg,
      #ffe8a5,
      #e6ba52
    );
}


/* =========================
   ФОТОГРАФИЯ
========================= */

.photo-card{
  position:absolute;

  left:50%;
  top:54%;

  z-index:40;

  width:min(61vw,900px);

  aspect-ratio:16/10;

  transform:
    translate(-50%,-50%)
    scale(.97);

  padding:
    16px 16px 52px;

  background:#fffdf8;

  border-radius:10px;

  box-shadow:
    0 24px 55px
    rgba(53,30,12,.30);

  opacity:0;

  transition:
    opacity .65s ease,
    transform .65s ease;

  cursor:pointer;
}

.photo-card.visible{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1);
}

.photo-area{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#d9d1c5;

  border-radius:3px;

  touch-action:none;
}

.photo{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  pointer-events:none;
  user-select:none;

  filter:
    grayscale(.78)
    sepia(.18)
    blur(7px)
    brightness(1.40)
    contrast(.74)
    saturate(.34);

  opacity:.66;

  transform:
    scale(1.025);

  transition:
    filter 2.1s cubic-bezier(.22,.8,.3,1),
    opacity 2.1s ease,
    transform 2.1s cubic-bezier(.22,.8,.3,1);
}

.photo.developed{
  filter:
    grayscale(0)
    sepia(0)
    blur(0)
    brightness(1)
    contrast(1)
    saturate(1);

  opacity:1;

  transform:
    scale(1);
}


/* =========================
   CANVAS РАСТВОРА
========================= */

#liquidCanvas{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  z-index:20;

  pointer-events:none;

  transition:
    opacity 1.2s ease;
}


/* =========================
   БАНОЧКА
========================= */

.developer{
  position:absolute;

  left:4%;
  bottom:6%;

  z-index:70;

  width:clamp(110px,13vw,190px);

  user-select:none;

  pointer-events:none;

  filter:
    drop-shadow(
      0 9px 9px
      rgba(40,20,8,.25)
    );

  opacity:0;

  transform:
    translateY(16px);

  transition:
    opacity .45s ease,
    transform .45s ease;
}

.developer.show{
  opacity:1;

  transform:
    translateY(0);
}


/* =========================
   КИСТОЧКА
========================= */

.brush{
  position:absolute;

  left:15%;
  bottom:5%;

  z-index:200;

  width:clamp(130px,16vw,230px);

  user-select:none;

  cursor:grab;

  touch-action:none;

  filter:
    drop-shadow(
      0 9px 8px
      rgba(44,25,10,.28)
    );

  opacity:0;

  transform:
    rotate(-18deg);

  transition:
    opacity .4s ease;
}

.brush.show{
  opacity:1;
}

.brush.dragging{
  cursor:grabbing;
  transition:none;
}


/* =========================
   ВОДЯНЫЕ КАПЛИ
========================= */

.drop{
  position:absolute;

  width:10px;
  height:14px;

  z-index:190;

  border-radius:
    50% 50% 55% 55%;

  background:
    rgba(220,245,255,.75);

  box-shadow:
    inset 0 0 5px
    rgba(255,255,255,.9),
    0 2px 4px
    rgba(70,100,110,.15);

  pointer-events:none;

  animation:
    dropFall .7s ease forwards;
}

@keyframes dropFall{

  0%{
    opacity:0;
    transform:
      translateY(-4px)
      scale(.7);
  }

  25%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:
      translateY(25px)
      scale(.9);
  }

}


/* =========================
   КНОПКА СЛЕДУЮЩАЯ
========================= */

.next-button{
  position:absolute;

  left:50%;
  bottom:24px;

  z-index:170;

  transform:
    translateX(-50%)
    translateY(10px);

  padding:
    13px 25px;

  border:0;

  border-radius:999px;

  background:
    rgba(255,250,239,.97);

  color:#5e412a;

  font-size:
    clamp(16px,1.5vw,21px);

  font-weight:800;

  box-shadow:
    0 8px 24px
    rgba(49,29,13,.22);

  cursor:pointer;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .35s ease,
    transform .35s ease;
}

.next-button.show{
  opacity:1;

  pointer-events:auto;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =========================
   ФИНАЛ
========================= */

.success{
  position:absolute;

  left:50%;
  top:50%;

  z-index:180;

  transform:
    translate(-50%,-50%)
    scale(.8);

  padding:
    18px 30px;

  border-radius:20px;

  background:
    rgba(255,250,239,.97);

  color:#624226;

  font-size:
    clamp(22px,2.7vw,38px);

  font-weight:800;

  box-shadow:
    0 15px 42px
    rgba(45,25,10,.25);

  opacity:0;

  pointer-events:none;

  transition:
    opacity .4s ease,
    transform .4s ease;
}

.success.show{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1);
}


/* =========================
   МОБИЛЬНОЕ
========================= */

@media(max-width:800px){

  .photo-card{
    width:72vw;
  }

  .developer{
    left:2%;
  }

  .brush{
    left:11%;
  }

  .switch-wrap{
    right:15px;
  }

}

</style>
</head>


<body>

<div
  class="game"
  id="game"
>

  <div
    class="instruction"
    id="instruction"
  >
    Включи свет 💡
  </div>


  <div
    class="darkness"
    id="darkness"
  ></div>


  <div
    class="switch-wrap"
    id="switchWrap"
  >

    <div class="switch-label">
      Свет
    </div>

    <button
      class="light-switch"
      id="lightSwitch"
      aria-label="Включить свет"
    >

      <span
        class="switch-button"
      ></span>

    </button>

  </div>


  <div
    class="photo-card"
    id="photoCard"
  >

    <div
      class="photo-area"
      id="photoArea"
    >

      <img
        id="photo"
        class="photo"
        src="images/capibara_1.png"
        alt="Капибара"
        draggable="false"
      >

      <canvas
        id="liquidCanvas"
      ></canvas>

    </div>

  </div>


  <img
    id="developer"
    class="developer"
    src="developer.png"
    alt=""
    draggable="false"
  >


  <img
    id="brush"
    class="brush"
    src="brush.png"
    alt=""
    draggable="false"
  >


  <button
    id="nextButton"
    class="next-button"
  >
    Следующая фотография →
  </button>


  <div
    id="success"
    class="success"
  >
    ✨ Все фотографии готовы! ✨
  </div>

</div>


<script>

/* =========================
   ФОТОГРАФИИ
========================= */

const photos = [
  "images/capibara_1.png",
  "images/capibara_2.png",
  "images/capibara_3.png",
  "images/capibara_4.png",
  "images/capibara_5.png",
  "images/capibara_6.png",
  "images/capibara_7.png",
  "images/capibara_8.png"
];

let currentPhoto = 0;


/* =========================
   ЭЛЕМЕНТЫ
========================= */

const game =
  document.getElementById("game");

const instruction =
  document.getElementById("instruction");

const darkness =
  document.getElementById("darkness");

const lightSwitch =
  document.getElementById("lightSwitch");

const switchWrap =
  document.getElementById("switchWrap");

const photoCard =
  document.getElementById("photoCard");

const photoArea =
  document.getElementById("photoArea");

const photo =
  document.getElementById("photo");

const developer =
  document.getElementById("developer");

const brush =
  document.getElementById("brush");

const nextButton =
  document.getElementById("nextButton");

const success =
  document.getElementById("success");

const canvas =
  document.getElementById("liquidCanvas");

const ctx =
  canvas.getContext("2d");


/* =========================
   СОСТОЯНИЕ
========================= */

let stage = "dark";

/*
  dark
  dip
  brush-photo
  ready
  developed
*/

let brushWet = false;

let dragging = false;

let grabOffsetX = 0;
let grabOffsetY = 0;

let wetStart = null;


/* =========================
   CANVAS
========================= */

let W = 1;
let H = 1;
let DPR = 1;

function resizeCanvas(){

  const rect =
    photoArea.getBoundingClientRect();

  W = rect.width;
  H = rect.height;

  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.round(W * DPR);

  canvas.height =
    Math.round(H * DPR);

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );
}


/* =========================
   ИНСТРУКЦИЯ
========================= */

function changeInstruction(text){

  instruction.classList.add(
    "hide"
  );

  setTimeout(
    () => {

      instruction.textContent =
        text;

      instruction.classList.remove(
        "hide"
      );

    },
    260
  );
}


/* =========================
   СВЕТ
========================= */

lightSwitch.addEventListener(
  "click",
  () => {

    if(stage !== "dark") return;

    lightSwitch.classList.add("on");

    darkness.classList.add("off");

    instruction.classList.add("hide");

    setTimeout(
      () => {

        photoCard.classList.add(
          "visible"
        );

      },
      420
    );

    setTimeout(
      () => {

        developer.classList.add(
          "show"
        );

        brush.classList.add(
          "show"
        );

        switchWrap.style.opacity = "0";
        switchWrap.style.pointerEvents = "none";

        beginDipStage();

      },
      1050
    );

  }
);


/* =========================
   НОВАЯ ФОТОГРАФИЯ
========================= */

function beginDipStage(){

  stage = "dip";

  brushWet = false;

  wetStart = null;

  canvas.style.opacity = "1";

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  photo.classList.remove(
    "developed"
  );

  brush.style.pointerEvents =
    "auto";

  brush.style.opacity =
    "1";

  nextButton.classList.remove(
    "show"
  );

  changeInstruction(
    "Обмакни кисточку в проявитель 💧"
  );
}


/* =========================
   DRAG КИСТИ
========================= */

brush.addEventListener(
  "pointerdown",
  e => {

    if(
      stage !== "dip" &&
      stage !== "brush-photo"
    ) return;

    e.preventDefault();

    dragging = true;

    brush.classList.add(
      "dragging"
    );

    brush.setPointerCapture(
      e.pointerId
    );

    const rect =
      brush.getBoundingClientRect();

    grabOffsetX =
      e.clientX -
      rect.left;

    grabOffsetY =
      e.clientY -
      rect.top;

    brush.style.position =
      "fixed";

    brush.style.left =
      rect.left + "px";

    brush.style.top =
      rect.top + "px";
  }
);


brush.addEventListener(
  "pointermove",
  e => {

    if(!dragging) return;

    brush.style.left =
      (
        e.clientX -
        grabOffsetX
      ) +
      "px";

    brush.style.top =
      (
        e.clientY -
        grabOffsetY
      ) +
      "px";


    if(stage === "dip"){

      checkDip();

    }


    if(
      stage === "brush-photo" &&
      brushWet
    ){

      paintPhoto();

    }

  }
);


brush.addEventListener(
  "pointerup",
  e => {

    dragging = false;

    brush.classList.remove(
      "dragging"
    );

    try{

      brush.releasePointerCapture(
        e.pointerId
      );

    }catch(err){}

  }
);


brush.addEventListener(
  "pointercancel",
  () => {

    dragging = false;

    brush.classList.remove(
      "dragging"
    );

  }
);


/* =========================
   ПРОВЕРКА МАКАНИЯ
========================= */

function getBrushTip(){

  const rect =
    brush.getBoundingClientRect();

  /*
    Кисть на PNG расположена по диагонали.
    Щетина находится ближе
    к левому нижнему краю.
  */

  return{

    x:
      rect.left +
      rect.width * 0.20,

    y:
      rect.top +
      rect.height * 0.78

  };
}


function checkDip(){

  const tip =
    getBrushTip();

  const jar =
    developer.getBoundingClientRect();


  /*
    Считаем, что кисть окунулась,
    если щетина попала
    в верхнюю часть банки.
  */

  const inside =

    tip.x >
    jar.left +
    jar.width * 0.17 &&

    tip.x <
    jar.right -
    jar.width * 0.17 &&

    tip.y >
    jar.top +
    jar.height * 0.03 &&

    tip.y <
    jar.top +
    jar.height * 0.43;


  if(
    inside &&
    !brushWet
  ){

    brushWet = true;

    stage =
      "brush-photo";

    createDrops(
      tip.x,
      tip.y
    );

    changeInstruction(
      "Теперь нанеси проявитель на фотографию 🖌️"
    );

  }

}


/* =========================
   КАПЛИ
========================= */

function createDrops(x,y){

  for(
    let i = 0;
    i < 3;
    i++
  ){

    const drop =
      document.createElement(
        "div"
      );

    drop.className =
      "drop";

    drop.style.left =
      (
        x +
        (Math.random()-.5)*22
      ) +
      "px";

    drop.style.top =
      (
        y +
        Math.random()*8
      ) +
      "px";

    game.appendChild(
      drop
    );

    setTimeout(
      () => {

        drop.remove();

      },
      750
    );

  }

}


/* =========================
   РИСУЕМ ВОДУ
========================= */

function paintPhoto(){

  const tip =
    getBrushTip();

  const rect =
    photoArea.getBoundingClientRect();


  if(
    tip.x < rect.left ||
    tip.x > rect.right ||
    tip.y < rect.top ||
    tip.y > rect.bottom
  ){

    wetStart = null;

    return;
  }


  const x =
    tip.x -
    rect.left;

  const y =
    tip.y -
    rect.top;


  const radius =
    38;


  const gradient =
    ctx.createRadialGradient(
      x,
      y,
      0,

      x,
      y,
      radius
    );


  gradient.addColorStop(
    0,
    "rgba(230,247,255,.22)"
  );

  gradient.addColorStop(
    .45,
    "rgba(213,238,249,.14)"
  );

  gradient.addColorStop(
    .8,
    "rgba(245,252,255,.06)"
  );

  gradient.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );


  ctx.fillStyle =
    gradient;

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    radius,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    Пока просто считаем,
    что около 2 секунд
    работы кистью достаточно.

    Механику растекания
    потом отдельно улучшим.
  */

  if(wetStart === null){

    wetStart =
      performance.now();

  }


  if(
    performance.now() -
    wetStart >
    2000
  ){

    finishBrushing();

  }

}


/* =========================
   ПОКА ПРОСТОЙ ФИНИШ КИСТИ
========================= */

function finishBrushing(){

  if(
    stage !==
    "brush-photo"
  ) return;


  stage =
    "ready";


  brush.style.pointerEvents =
    "none";

  brush.style.opacity =
    ".45";


  /*
    Пока простая лёгкая водяная
    плёнка поверх всей фотографии.
    Именно её потом будем переделывать.
  */

  ctx.fillStyle =
    "rgba(220,242,250,.08)";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  changeInstruction(
    "Готово! Нажми на фотографию 📸"
  );

}


/* =========================
   ПРОЯВЛЕНИЕ
========================= */

photoCard.addEventListener(
  "click",
  () => {

    if(stage !== "ready") return;

    stage =
      "developed";

    instruction.classList.add(
      "hide"
    );

    canvas.style.opacity =
      "0";

    photo.classList.add(
      "developed"
    );


    setTimeout(
      () => {

        if(
          currentPhoto <
          photos.length - 1
        ){

          nextButton.classList.add(
            "show"
          );

        }else{

          success.classList.add(
            "show"
          );

        }

      },
      1900
    );

  }
);


/* =========================
   СЛЕДУЮЩАЯ
========================= */

nextButton.addEventListener(
  "click",
  e => {

    e.stopPropagation();

    if(
      currentPhoto >=
      photos.length - 1
    ) return;


    nextButton.classList.remove(
      "show"
    );

    instruction.classList.add(
      "hide"
    );

    photoCard.style.opacity =
      "0";


    setTimeout(
      () => {

        currentPhoto++;

        photo.src =
          photos[currentPhoto];

        photo.classList.remove(
          "developed"
        );

        canvas.style.opacity =
          "1";

        ctx.clearRect(
          0,
          0,
          W,
          H
        );

        photoCard.style.opacity =
          "1";

        /*
          Кисть снова активна.
          Банка остаётся на месте.
        */

        brush.style.pointerEvents =
          "auto";

        brush.style.opacity =
          "1";

        beginDipStage();

      },
      500
    );

  }
);


/* =========================
   START
========================= */

window.addEventListener(
  "load",
  () => {

    resizeCanvas();

    photos.forEach(
      src => {

        const preload =
          new Image();

        preload.src =
          src;

      }
    );

  }
);


if(window.ResizeObserver){

  new ResizeObserver(
    resizeCanvas
  ).observe(
    photoArea
  );

}

</script>

</body>
</html>
