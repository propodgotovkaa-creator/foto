<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Фотостудия капибары</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#1d1712;
}

.game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;

  background-image:url("Fon.PNG");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

/* =========================
   ТЕМНОТА
========================= */

.darkness{
  position:absolute;
  inset:0;
  z-index:80;

  background:rgba(6,7,9,.92);

  pointer-events:none;

  transition:opacity 1.25s ease;
}

.darkness.off{
  opacity:0;
}

/* =========================
   ИНСТРУКЦИЯ
========================= */

.instruction{
  position:absolute;

  left:50%;
  top:28px;

  z-index:140;

  transform:translateX(-50%);

  max-width:min(82vw,760px);

  padding:13px 24px;

  border-radius:20px;

  background:rgba(255,250,239,.95);

  color:#5d4029;

  font-size:clamp(17px,1.9vw,27px);

  font-weight:800;

  text-align:center;

  box-shadow:
    0 8px 28px rgba(52,31,14,.22);

  transition:
    opacity .35s ease,
    transform .35s ease;
}

.instruction.hide{
  opacity:0;

  transform:
    translateX(-50%)
    translateY(-8px);
}

/* =========================
   ВЫКЛЮЧАТЕЛЬ
========================= */

.switch-wrap{
  position:absolute;

  right:45px;
  top:50%;

  z-index:150;

  transform:translateY(-50%);

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;

  transition:opacity .45s ease;
}

.switch-label{
  color:#fff;
  font-size:15px;

  text-shadow:
    0 2px 6px rgba(0,0,0,.8);
}

.light-switch{
  position:relative;

  width:72px;
  height:108px;

  border:0;

  border-radius:12px;

  background:#eee8dc;

  cursor:pointer;

  box-shadow:
    0 8px 22px rgba(0,0,0,.42),
    inset 0 0 0 2px rgba(90,80,65,.12);
}

.switch-button{
  position:absolute;

  left:17px;
  top:16px;

  width:38px;
  height:75px;

  border-radius:6px;

  background:
    linear-gradient(
      180deg,
      #faf8f1,
      #cbc4b7
    );

  box-shadow:
    0 4px 8px rgba(0,0,0,.28);

  transition:
    transform .3s ease,
    background .3s ease;
}

.light-switch.on .switch-button{
  transform:translateY(12px);

  background:
    linear-gradient(
      180deg,
      #ffe8a5,
      #e6ba52
    );
}

/* =========================
   ФОТО
========================= */

.photo-card{
  position:absolute;

  left:50%;
  top:54%;

  z-index:40;

  width:min(61vw,900px);

  aspect-ratio:16/10;

  transform:
    translate(-50%,-50%)
    scale(.97);

  padding:
    16px 16px 52px;

  background:#fffdf8;

  border-radius:10px;

  box-shadow:
    0 24px 55px rgba(53,30,12,.30);

  opacity:0;

  transition:
    opacity .65s ease,
    transform .65s ease;

  cursor:pointer;
}

.photo-card.visible{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1);
}

.photo-area{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#d9d1c5;

  border-radius:3px;

  touch-action:none;
}

.photo{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  pointer-events:none;
  user-select:none;

  filter:
    grayscale(.78)
    sepia(.18)
    blur(7px)
    brightness(1.40)
    contrast(.74)
    saturate(.34);

  opacity:.66;

  transform:scale(1.025);

  transition:
    filter 2.1s cubic-bezier(.22,.8,.3,1),
    opacity 2.1s ease,
    transform 2.1s cubic-bezier(.22,.8,.3,1);
}

.photo.developed{
  filter:
    grayscale(0)
    sepia(0)
    blur(0)
    brightness(1)
    contrast(1)
    saturate(1);

  opacity:1;

  transform:scale(1);
}

/* =========================
   РАСТВОР
========================= */

#liquidCanvas{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  z-index:20;

  pointer-events:none;

  transition:
    opacity 1.2s ease,
    filter .8s ease;
}

/* =========================
   БАНОЧКА
========================= */

.developer{
  position:absolute;

  left:4%;
  bottom:6%;

  z-index:70;

  width:clamp(110px,13vw,190px);

  user-select:none;
  pointer-events:none;

  filter:
    drop-shadow(
      0 9px 9px rgba(40,20,8,.25)
    );

  opacity:0;

  transform:translateY(16px);

  transition:
    opacity .45s ease,
    transform .45s ease;
}

.developer.show{
  opacity:1;
  transform:translateY(0);
}

/* =========================
   КИСТОЧКА
========================= */

.brush-wrap{
  position:absolute;

  right:4%;
  bottom:6%;

  z-index:220;

  width:clamp(130px,16vw,230px);

  user-select:none;

  cursor:grab;

  touch-action:none;

  opacity:0;

  transform:rotate(-18deg);

  transform-origin:center center;

  transition:
    opacity .4s ease;
}

.brush-wrap.show{
  opacity:1;
}

.brush-wrap.dragging{
  cursor:grabbing;
  transition:none;
}

.brush-img{
  display:block;

  width:100%;
  height:auto;

  pointer-events:none;

  filter:
    drop-shadow(
      0 9px 8px rgba(44,25,10,.28)
    );

  transition:
    opacity .28s ease;
}

/* сухая кисть */

.brush-dry{
  position:relative;
  z-index:2;
  opacity:1;
}

/* мокрая кисть */

.brush-wet{
  position:absolute;

  inset:0;

  z-index:3;

  width:100%;
  height:100%;

  object-fit:contain;

  opacity:0;
}

/* после макания */

.brush-wrap.wet .brush-dry{
  opacity:0;
}

.brush-wrap.wet .brush-wet{
  opacity:1;
}

/* =========================
   ДОПОЛНИТЕЛЬНАЯ ЖИВАЯ КАПЛЯ
========================= */

.brush-drop{
  position:absolute;

  left:10%;
  bottom:2%;

  z-index:5;

  width:13px;
  height:19px;

  border-radius:
    50% 50% 58% 58%;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.95),
      rgba(190,230,245,.65)
    );

  box-shadow:
    inset -2px -3px 5px rgba(90,150,180,.18),
    inset 2px 2px 5px rgba(255,255,255,.85),
    0 2px 5px rgba(40,80,100,.16);

  opacity:0;

  pointer-events:none;

  transform-origin:50% 0%;

  transition:opacity .25s ease;
}

.brush-wrap.wet .brush-drop{
  opacity:1;

  animation:
    dropSwing 1.1s ease-in-out infinite alternate;
}

@keyframes dropSwing{

  from{
    transform:
      rotate(-6deg)
      scaleY(.95);
  }

  to{
    transform:
      rotate(8deg)
      scaleY(1.08);
  }

}

/* =========================
   ПАДАЮЩИЕ КАПЛИ
========================= */

.falling-drop{
  position:absolute;

  width:9px;
  height:14px;

  z-index:210;

  border-radius:
    50% 50% 58% 58%;

  background:
    rgba(225,247,255,.82);

  box-shadow:
    inset 0 0 5px rgba(255,255,255,.95);

  pointer-events:none;

  animation:
    fallingDrop .75s ease-in forwards;
}

@keyframes fallingDrop{

  0%{
    opacity:1;

    transform:
      translateY(0)
      scale(.85);
  }

  100%{
    opacity:0;

    transform:
      translateY(36px)
      scale(.65);
  }

}

/* =========================
   СЛЕДУЮЩАЯ ФОТО
========================= */

.next-button{
  position:absolute;

  left:50%;
  bottom:24px;

  z-index:170;

  transform:
    translateX(-50%)
    translateY(10px);

  padding:13px 25px;

  border:0;

  border-radius:999px;

  background:rgba(255,250,239,.97);

  color:#5e412a;

  font-size:clamp(16px,1.5vw,21px);

  font-weight:800;

  box-shadow:
    0 8px 24px rgba(49,29,13,.22);

  cursor:pointer;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .35s ease,
    transform .35s ease;
}

.next-button.show{
  opacity:1;

  pointer-events:auto;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================
   ФИНАЛ
========================= */

.success{
  position:absolute;

  left:50%;
  top:50%;

  z-index:180;

  transform:
    translate(-50%,-50%)
    scale(.8);

  padding:18px 30px;

  border-radius:20px;

  background:rgba(255,250,239,.97);

  color:#624226;

  font-size:clamp(22px,2.7vw,38px);

  font-weight:800;

  box-shadow:
    0 15px 42px rgba(45,25,10,.25);

  opacity:0;

  pointer-events:none;

  transition:
    opacity .4s ease,
    transform .4s ease;
}

.success.show{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1);
}

@media(max-width:800px){

  .photo-card{
    width:72vw;
  }

  .developer{
    left:2%;
  }

  .brush-wrap{
    right:2%;
  }

  .switch-wrap{
    right:15px;
  }
}

</style>
</head>

<body>

<div class="game" id="game">

  <div
    class="instruction"
    id="instruction"
  >
    Включи свет 💡
  </div>

  <div
    class="darkness"
    id="darkness"
  ></div>

  <div
    class="switch-wrap"
    id="switchWrap"
  >

    <div class="switch-label">
      Свет
    </div>

    <button
      class="light-switch"
      id="lightSwitch"
      aria-label="Включить свет"
    >

      <span
        class="switch-button"
      ></span>

    </button>

  </div>

  <div
    class="photo-card"
    id="photoCard"
  >

    <div
      class="photo-area"
      id="photoArea"
    >

      <img
        id="photo"
        class="photo"
        src="images/capibara_1.png"
        alt="Капибара"
        draggable="false"
      >

      <canvas
        id="liquidCanvas"
      ></canvas>

    </div>

  </div>

  <img
    id="developer"
    class="developer"
    src="developer.png"
    alt=""
    draggable="false"
  >

  <div
    id="brushWrap"
    class="brush-wrap"
  >

    <img
      id="brushDry"
      class="brush-img brush-dry"
      src="brush.png"
      alt=""
      draggable="false"
    >

    <img
      id="brushWet"
      class="brush-img brush-wet"
      src="wet-brush.png"
      alt=""
      draggable="false"
    >

    <div
      class="brush-drop"
      id="brushDrop"
    ></div>

  </div>

  <button
    id="nextButton"
    class="next-button"
  >
    Следующая фотография →
  </button>

  <div
    id="success"
    class="success"
  >
    ✨ Все фотографии готовы! ✨
  </div>

</div>

<script>

/* =========================
   ФОТОГРАФИИ
========================= */

const photos = [
  "images/capibara_1.png",
  "images/capibara_2.png",
  "images/capibara_3.png",
  "images/capibara_4.png",
  "images/capibara_5.png",
  "images/capibara_6.png",
  "images/capibara_7.png",
  "images/capibara_8.png"
];

let currentPhoto = 0;


/* =========================
   ЭЛЕМЕНТЫ
========================= */

const game =
  document.getElementById("game");

const instruction =
  document.getElementById("instruction");

const darkness =
  document.getElementById("darkness");

const lightSwitch =
  document.getElementById("lightSwitch");

const switchWrap =
  document.getElementById("switchWrap");

const photoCard =
  document.getElementById("photoCard");

const photoArea =
  document.getElementById("photoArea");

const photo =
  document.getElementById("photo");

const developer =
  document.getElementById("developer");

const brushWrap =
  document.getElementById("brushWrap");

const nextButton =
  document.getElementById("nextButton");

const success =
  document.getElementById("success");

const canvas =
  document.getElementById("liquidCanvas");

const ctx =
  canvas.getContext("2d");


/* =========================
   СОСТОЯНИЕ
========================= */

let stage = "dark";

let brushWet = false;

let dragging = false;

let grabOffsetX = 0;
let grabOffsetY = 0;

let previousPointerX = null;
let previousPointerY = null;

let wetStart = null;

let lastLooseDrop = 0;

let lastPaintX = null;
let lastPaintY = null;


/* =========================
   CANVAS
========================= */

let W = 1;
let H = 1;
let DPR = 1;


function resizeCanvas(){

  const rect =
    photoArea.getBoundingClientRect();

  W = rect.width;
  H = rect.height;

  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.round(W * DPR);

  canvas.height =
    Math.round(H * DPR);

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";
}


/* =========================
   ИНСТРУКЦИЯ
========================= */

function changeInstruction(text){

  instruction.classList.add(
    "hide"
  );

  setTimeout(
    () => {

      instruction.textContent =
        text;

      instruction.classList.remove(
        "hide"
      );

    },
    260
  );
}


/* =========================
   СВЕТ
========================= */

lightSwitch.addEventListener(
  "click",
  () => {

    if(stage !== "dark") return;

    lightSwitch.classList.add(
      "on"
    );

    darkness.classList.add(
      "off"
    );

    instruction.classList.add(
      "hide"
    );

    setTimeout(
      () => {

        photoCard.classList.add(
          "visible"
        );

      },
      420
    );

    setTimeout(
      () => {

        developer.classList.add(
          "show"
        );

        brushWrap.classList.add(
          "show"
        );

        switchWrap.style.opacity =
          "0";

        switchWrap.style.pointerEvents =
          "none";

        beginDipStage();

      },
      1050
    );

  }
);


/* =========================
   СТАРТ НОВОЙ ФОТО
========================= */

function beginDipStage(){

  stage =
    "dip";

  brushWet =
    false;

  wetStart =
    null;

  previousPointerX =
    null;

  previousPointerY =
    null;

  lastPaintX =
    null;

  lastPaintY =
    null;

  /*
    Снова сухая кисть
  */

  brushWrap.classList.remove(
    "wet"
  );

  brushWrap.style.position =
    "absolute";

  brushWrap.style.left =
    "auto";

  brushWrap.style.top =
    "auto";

  brushWrap.style.right =
    "4%";

  brushWrap.style.bottom =
    "6%";

  brushWrap.style.opacity =
    "1";

  brushWrap.style.pointerEvents =
    "auto";

  brushWrap.style.transform =
    "rotate(-18deg)";

  canvas.style.opacity =
    "1";

  canvas.style.filter =
    "none";

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  photo.classList.remove(
    "developed"
  );

  nextButton.classList.remove(
    "show"
  );

  changeInstruction(
    "Обмакни кисточку в проявитель 💧"
  );
}


/* =========================
   DRAG
========================= */

brushWrap.addEventListener(
  "pointerdown",
  e => {

    if(
      stage !== "dip" &&
      stage !== "brush-photo"
    ) return;

    e.preventDefault();

    dragging =
      true;

    brushWrap.classList.add(
      "dragging"
    );

    brushWrap.setPointerCapture(
      e.pointerId
    );

    const rect =
      brushWrap.getBoundingClientRect();

    grabOffsetX =
      e.clientX -
      rect.left;

    grabOffsetY =
      e.clientY -
      rect.top;

    previousPointerX =
      e.clientX;

    previousPointerY =
      e.clientY;

    brushWrap.style.position =
      "fixed";

    brushWrap.style.right =
      "auto";

    brushWrap.style.bottom =
      "auto";

    brushWrap.style.left =
      rect.left + "px";

    brushWrap.style.top =
      rect.top + "px";
  }
);


brushWrap.addEventListener(
  "pointermove",
  e => {

    if(!dragging) return;

    const dx =
      previousPointerX === null
      ? 0
      : e.clientX - previousPointerX;

    const dy =
      previousPointerY === null
      ? 0
      : e.clientY - previousPointerY;

    brushWrap.style.left =
      (
        e.clientX -
        grabOffsetX
      ) +
      "px";

    brushWrap.style.top =
      (
        e.clientY -
        grabOffsetY
      ) +
      "px";


    const angle =
      Math.max(
        -25,
        Math.min(
          8,
          -18 + dx * .12
        )
      );

    brushWrap.style.transform =
      `rotate(${angle}deg)`;


    if(stage === "dip"){

      checkDip();

    }


    if(
      stage === "brush-photo" &&
      brushWet
    ){

      paintPhoto(
        dx,
        dy
      );

      maybeDropWater(
        dx,
        dy
      );

    }


    previousPointerX =
      e.clientX;

    previousPointerY =
      e.clientY;

  }
);


brushWrap.addEventListener(
  "pointerup",
  e => {

    dragging =
      false;

    previousPointerX =
      null;

    previousPointerY =
      null;

    lastPaintX =
      null;

    lastPaintY =
      null;

    brushWrap.classList.remove(
      "dragging"
    );

    try{

      brushWrap.releasePointerCapture(
        e.pointerId
      );

    }catch(err){}

  }
);


brushWrap.addEventListener(
  "pointercancel",
  () => {

    dragging =
      false;

    previousPointerX =
      null;

    previousPointerY =
      null;

    lastPaintX =
      null;

    lastPaintY =
      null;

    brushWrap.classList.remove(
      "dragging"
    );

  }
);


/* =========================
   КОНЧИК ЩЕТИНЫ
========================= */

function getBrushTip(){

  const rect =
    brushWrap.getBoundingClientRect();

  return{

    x:
      rect.left +
      rect.width * .17,

    y:
      rect.top +
      rect.height * .82

  };
}


/* =========================
   МАКАНИЕ
========================= */

function checkDip(){

  const tip =
    getBrushTip();

  const jar =
    developer.getBoundingClientRect();


  const inside =

    tip.x >
    jar.left +
    jar.width * .14 &&

    tip.x <
    jar.right -
    jar.width * .14 &&

    tip.y >
    jar.top +
    jar.height * .02 &&

    tip.y <
    jar.top +
    jar.height * .48;


  if(
    inside &&
    !brushWet
  ){

    brushWet =
      true;

    stage =
      "brush-photo";


    /*
      КЛЮЧЕВОЕ:
      просто включаем класс wet.
      Сухая исчезает,
      мокрая появляется.
    */

    brushWrap.classList.add(
      "wet"
    );


    createSplash(
      tip.x,
      tip.y
    );


    changeInstruction(
      "Теперь нанеси проявитель на фотографию 🖌️"
    );

  }

}


/* =========================
   ВСПЛЕСК
========================= */

function createSplash(x,y){

  for(
    let i=0;
    i<4;
    i++
  ){

    const drop =
      document.createElement(
        "div"
      );

    drop.className =
      "falling-drop";

    drop.style.left =
      (
        x +
        (Math.random()-.5)*24
      ) +
      "px";

    drop.style.top =
      (
        y +
        Math.random()*5
      ) +
      "px";

    game.appendChild(
      drop
    );

    setTimeout(
      () => drop.remove(),
      800
    );
  }

}


/* =========================
   ОТРЫВАЮЩИЕСЯ КАПЛИ
========================= */

function maybeDropWater(
  dx,
  dy
){

  const now =
    performance.now();

  const speed =
    Math.sqrt(
      dx*dx +
      dy*dy
    );


  if(
    speed > 6 &&
    now -
    lastLooseDrop >
    550 &&
    Math.random() <
    .22
  ){

    lastLooseDrop =
      now;


    const tip =
      getBrushTip();


    const drop =
      document.createElement(
        "div"
      );


    drop.className =
      "falling-drop";


    drop.style.left =
      tip.x + "px";

    drop.style.top =
      tip.y + "px";


    game.appendChild(
      drop
    );


    setTimeout(
      () => drop.remove(),
      800
    );

  }

}


/* =========================
   ВОДЯНОЙ МАЗОК
========================= */

function paintPhoto(
  moveX,
  moveY
){

  const tip =
    getBrushTip();

  const rect =
    photoArea.getBoundingClientRect();


  if(
    tip.x < rect.left ||
    tip.x > rect.right ||
    tip.y < rect.top ||
    tip.y > rect.bottom
  ){

    lastPaintX =
      null;

    lastPaintY =
      null;

    wetStart =
      null;

    return;
  }


  const x =
    tip.x -
    rect.left;

  const y =
    tip.y -
    rect.top;


  if(
    lastPaintX === null ||
    lastPaintY === null
  ){

    lastPaintX =
      x;

    lastPaintY =
      y;

    wetStart =
      performance.now();

    return;
  }


  const speed =
    Math.sqrt(
      moveX*moveX +
      moveY*moveY
    );


  const width =
    Math.max(
      20,
      Math.min(
        36,
        34 -
        speed*.35
      )
    );


  /*
    Основной мокрый след
  */

  ctx.save();


  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";

  ctx.lineWidth =
    width;


  const g =
    ctx.createLinearGradient(
      lastPaintX,
      lastPaintY,
      x,
      y
    );


  g.addColorStop(
    0,
    "rgba(210,236,246,.09)"
  );

  g.addColorStop(
    .5,
    "rgba(225,245,252,.17)"
  );

  g.addColorStop(
    1,
    "rgba(205,232,244,.10)"
  );


  ctx.strokeStyle =
    g;


  ctx.beginPath();

  ctx.moveTo(
    lastPaintX,
    lastPaintY
  );

  ctx.lineTo(
    x,
    y
  );

  ctx.stroke();


  /*
    Световой блик
  */

  ctx.lineWidth =
    Math.max(
      3,
      width*.18
    );


  ctx.strokeStyle =
    "rgba(255,255,255,.16)";


  ctx.beginPath();

  ctx.moveTo(
    lastPaintX,
    lastPaintY - 3
  );

  ctx.lineTo(
    x,
    y - 3
  );

  ctx.stroke();


  ctx.restore();


  lastPaintX =
    x;

  lastPaintY =
    y;


  if(
    wetStart ===
    null
  ){

    wetStart =
      performance.now();

  }


  if(
    performance.now() -
    wetStart >
    2000
  ){

    finishBrushing();

  }

}


/* =========================
   ДОСТАТОЧНО РАСТВОРА
========================= */

function finishBrushing(){

  if(
    stage !==
    "brush-photo"
  ) return;


  stage =
    "ready";

  dragging =
    false;


  brushWrap.style.pointerEvents =
    "none";


  setTimeout(
    () => {

      brushWrap.style.opacity =
        "0";

    },
    100
  );


  /*
    Пока простая общая водяная плёнка.
    Растекание улучшим отдельно.
  */

  ctx.fillStyle =
    "rgba(220,242,250,.07)";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  setTimeout(
    () => {

      changeInstruction(
        "Готово! Нажми на фотографию 📸"
      );

    },
    300
  );

}


/* =========================
   ПРОЯВЛЕНИЕ
========================= */

photoCard.addEventListener(
  "click",
  () => {

    if(
      stage !==
      "ready"
    ) return;


    stage =
      "developed";


    instruction.classList.add(
      "hide"
    );


    canvas.style.opacity =
      "0";


    photo.classList.add(
      "developed"
    );


    setTimeout(
      () => {

        if(
          currentPhoto <
          photos.length - 1
        ){

          nextButton.classList.add(
            "show"
          );

        }else{

          success.classList.add(
            "show"
          );

        }

      },
      1900
    );

  }
);


/* =========================
   СЛЕДУЮЩАЯ
========================= */

nextButton.addEventListener(
  "click",
  e => {

    e.stopPropagation();


    if(
      currentPhoto >=
      photos.length - 1
    ) return;


    nextButton.classList.remove(
      "show"
    );


    instruction.classList.add(
      "hide"
    );


    photoCard.style.opacity =
      "0";


    setTimeout(
      () => {

        currentPhoto++;


        photo.src =
          photos[
            currentPhoto
          ];


        photo.classList.remove(
          "developed"
        );


        canvas.style.opacity =
          "1";

        canvas.style.filter =
          "none";


        ctx.clearRect(
          0,
          0,
          W,
          H
        );


        photoCard.style.opacity =
          "1";


        beginDipStage();

      },
      500
    );

  }
);


/* =========================
   START
========================= */

window.addEventListener(
  "load",
  () => {

    resizeCanvas();


    photos.forEach(
      src => {

        const preload =
          new Image();

        preload.src =
          src;

      }
    );


    /*
      заранее загружаем обе кисточки
    */

    const preloadDry =
      new Image();

    preloadDry.src =
      "brush.png";


    const preloadWet =
      new Image();

    preloadWet.src =
      "wet-brush.png";

  }
);


if(
  window.ResizeObserver
){

  new ResizeObserver(
    resizeCanvas
  ).observe(
    photoArea
  );

}

</script>
