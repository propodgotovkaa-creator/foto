<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Фотостудия капибары</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#1d1712;
}

.game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;

  background-image:url("Fon.PNG");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}


/* =========================================
   ТЕМНОТА
========================================= */

.darkness{
  position:absolute;
  inset:0;

  z-index:80;

  background:rgba(6,7,9,.93);

  pointer-events:none;

  transition:opacity 1.3s ease;
}

.darkness.off{
  opacity:0;
}


/* =========================================
   ИНСТРУКЦИЯ
========================================= */

.instruction{
  position:absolute;

  left:50%;
  top:26px;

  z-index:300;

  transform:translateX(-50%);

  max-width:min(82vw,760px);

  padding:13px 24px;

  border-radius:20px;

  background:rgba(255,250,239,.96);

  color:#5d4029;

  font-size:clamp(17px,1.9vw,27px);

  font-weight:800;

  text-align:center;

  box-shadow:
    0 8px 28px
    rgba(52,31,14,.22);

  transition:
    opacity .32s ease,
    transform .32s ease;
}

.instruction.hide{
  opacity:0;

  transform:
    translateX(-50%)
    translateY(-8px);

  pointer-events:none;
}


/* =========================================
   ВЫКЛЮЧАТЕЛЬ
========================================= */

.switch-wrap{
  position:absolute;

  right:45px;
  top:50%;

  z-index:310;

  transform:translateY(-50%);

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:8px;

  transition:opacity .45s ease;
}

.switch-label{
  color:#fff;

  font-size:15px;

  text-shadow:
    0 2px 6px
    rgba(0,0,0,.8);
}

.light-switch{
  position:relative;

  width:72px;
  height:108px;

  border:0;

  border-radius:12px;

  background:#eee8dc;

  cursor:pointer;

  box-shadow:
    0 8px 22px rgba(0,0,0,.42),
    inset 0 0 0 2px rgba(90,80,65,.12);
}

.switch-button{
  position:absolute;

  left:17px;
  top:16px;

  width:38px;
  height:75px;

  border-radius:6px;

  background:
    linear-gradient(
      180deg,
      #faf8f1,
      #cbc4b7
    );

  box-shadow:
    0 4px 8px
    rgba(0,0,0,.28);

  transition:
    transform .3s ease,
    background .3s ease;
}

.light-switch.on .switch-button{
  transform:translateY(12px);

  background:
    linear-gradient(
      180deg,
      #ffe8a5,
      #e6ba52
    );
}


/* =========================================
   ФОТОКАРТОЧКА
========================================= */

.photo-card{
  position:absolute;

  left:50%;
  top:54%;

  z-index:40;

  width:min(58vw,820px);

  aspect-ratio:4 / 3;

  transform:
    translate(-50%,-50%)
    scale(.97);

  padding:
    16px 16px 52px;

  background:#fffdf8;

  border-radius:10px;

  box-shadow:
    0 24px 55px
    rgba(53,30,12,.30);

  opacity:0;

  transition:
    opacity .65s ease,
    transform .65s ease;

  cursor:pointer;
}

.photo-card.visible{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1);
}

.photo-area{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#eeeae2;

  border-radius:3px;

  touch-action:none;
}


/* =========================================
   ФОТОГРАФИЯ
========================================= */

.photo{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;

  pointer-events:none;
  user-select:none;

  filter:
    grayscale(.92)
    brightness(1.06)
    contrast(.82)
    saturate(.15);

  opacity:.88;

  transform:scale(1);

  transition:
    filter 2.1s cubic-bezier(.22,.8,.3,1),
    opacity 2.1s ease,
    transform 2.1s cubic-bezier(.22,.8,.3,1);
}

.photo.developed{
  filter:
    grayscale(0)
    brightness(1)
    contrast(1)
    saturate(1);

  opacity:1;

  transform:scale(1);
}


/* =========================================
   ЗАСВЕЧЕННАЯ ФОТОБУМАГА
========================================= */

.exposure-layer{
  position:absolute;
  inset:0;

  z-index:10;

  pointer-events:none;

  background:
    linear-gradient(
      135deg,
      rgba(250,248,239,.72),
      rgba(232,230,220,.66),
      rgba(248,246,238,.72)
    );

  backdrop-filter:
    blur(5px)
    grayscale(1);

  -webkit-backdrop-filter:
    blur(5px)
    grayscale(1);

  opacity:1;

  transition:
    opacity 1.8s ease;
}

.exposure-layer::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at 28% 30%,
      rgba(255,255,255,.22),
      transparent 38%
    ),

    radial-gradient(
      circle at 72% 68%,
      rgba(220,215,202,.12),
      transparent 42%
    );

  opacity:.65;
}


/* =========================================
   ВОДЯНОЙ СЛОЙ
========================================= */

.water-layer{
  position:absolute;
  inset:0;

  z-index:30;

  overflow:hidden;

  pointer-events:none;

  opacity:1;

  transition:
    opacity 1.25s ease;
}


/* =========================================
   ВОДЯНЫЕ ПЯТНА
========================================= */

.water-blob{
  position:absolute;

  width:130px;

  pointer-events:none;

  transform:
    translate(-50%,-50%)
    scale(.20);

  transform-origin:center;

  opacity:0;

  mix-blend-mode:screen;

  filter:
    saturate(.55)
    brightness(1.08);

  animation:
    blobAppear 1.1s
    cubic-bezier(.16,.8,.25,1)
    forwards;
}

@keyframes blobAppear{

  0%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.18);
  }

  22%{
    opacity:.48;
  }

  100%{
    opacity:.52;

    transform:
      translate(-50%,-50%)
      scale(1);
  }
}


/* =========================================
   КРАЙ РАСТЕКАНИЯ
========================================= */

.water-edge{
  position:absolute;

  left:50%;
  top:50%;

  width:55%;

  z-index:40;

  pointer-events:none;

  opacity:0;

  transform:
    translate(-50%,-50%)
    scale(.15);

  transform-origin:center;

  mix-blend-mode:screen;

  filter:
    saturate(.55)
    brightness(1.03);
}

.water-edge.spread{
  animation:
    edgeSpread 1.75s
    cubic-bezier(.12,.66,.22,1)
    forwards;
}

@keyframes edgeSpread{

  0%{
    opacity:.82;

    transform:
      translate(-50%,-50%)
      scale(.12);
  }

  60%{
    opacity:.62;
  }

  100%{
    opacity:.32;

    transform:
      translate(-50%,-50%)
      scale(3.25);
  }
}


/* =========================================
   ПОЛНОСТЬЮ МОКРАЯ ФОТОГРАФИЯ
========================================= */

.full-water{
  position:absolute;

  inset:-8%;

  z-index:45;

  opacity:0;

  pointer-events:none;

  background:
    rgba(205,232,242,.11);

  transition:
    opacity .75s ease;

  overflow:hidden;
}

.full-water.show{
  opacity:1;
}


/* =========================================
   ДВИЖУЩИЕСЯ БЛИКИ
========================================= */

.water-shine{
  position:absolute;

  inset:-18%;

  width:136%;
  height:136%;

  object-fit:cover;

  opacity:.42;

  mix-blend-mode:screen;

  filter:
    saturate(.5)
    brightness(1.2);

  animation:
    shineMove 4.5s
    ease-in-out
    infinite alternate;
}

@keyframes shineMove{

  from{
    transform:
      translate(-2%,-1%)
      scale(1.02);
  }

  to{
    transform:
      translate(3%,2%)
      scale(1.08);
  }
}


/* проходящий блик */

.full-water::after{
  content:"";

  position:absolute;

  left:-40%;
  top:-30%;

  width:45%;
  height:180%;

  transform:rotate(18deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.12),
      rgba(255,255,255,.26),
      rgba(255,255,255,.08),
      transparent
    );

  animation:
    waterReflection 3.5s
    ease-in-out infinite;
}

@keyframes waterReflection{

  0%{
    left:-50%;
  }

  100%{
    left:120%;
  }
}


/* =========================================
   БАНОЧКА
========================================= */

.developer{
  position:absolute;

  left:4%;
  bottom:6%;

  z-index:70;

  width:
    clamp(110px,13vw,190px);

  user-select:none;

  pointer-events:none;

  filter:
    drop-shadow(
      0 9px 9px
      rgba(40,20,8,.25)
    );

  opacity:0;

  transform:
    translateY(16px);

  transition:
    opacity .45s ease,
    transform .45s ease;
}

.developer.show{
  opacity:1;

  transform:
    translateY(0);
}


/* =========================================
   КИСТЬ
========================================= */

.brush-wrap{
  position:absolute;

  right:4%;
  bottom:6%;

  z-index:240;

  width:
    clamp(130px,16vw,230px);

  user-select:none;

  cursor:grab;

  touch-action:none;

  opacity:0;

  transform:
    rotate(-18deg);

  transform-origin:center;

  transition:
    opacity .4s ease;
}

.brush-wrap.show{
  opacity:1;
}

.brush-wrap.dragging{
  cursor:grabbing;
  transition:none;
}

.brush-img{
  display:block;

  width:100%;
  height:auto;

  pointer-events:none;

  filter:
    drop-shadow(
      0 9px 8px
      rgba(44,25,10,.28)
    );
}


/* =========================================
   МОКРАЯ ЩЕТИНА

   Только блеск.
   Постоянной капли больше НЕТ.
========================================= */

.wet-glow{
  position:absolute;

  left:3%;
  bottom:3%;

  width:43%;
  height:34%;

  border-radius:
    45% 40% 50% 45%;

  opacity:0;

  pointer-events:none;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.02),
      rgba(225,246,255,.25),
      rgba(255,255,255,.44),
      rgba(205,235,248,.12)
    );

  mix-blend-mode:screen;

  filter:blur(2px);

  transition:
    opacity .25s ease;
}

.brush-wrap.wet .wet-glow{
  opacity:1;
}


/* =========================================
   ПАДАЮЩИЕ МАЛЕНЬКИЕ КАПЛИ

   Их оставляем.
========================================= */

.falling-drop{
  position:absolute;

  z-index:230;

  width:9px;
  height:14px;

  pointer-events:none;

  border-radius:
    50% 50% 58% 58%;

  background:
    rgba(225,247,255,.84);

  box-shadow:
    inset 0 0 5px
    rgba(255,255,255,.95);

  animation:
    fallingDrop .75s
    ease-in forwards;
}

@keyframes fallingDrop{

  from{
    opacity:1;

    transform:
      translateY(0)
      scale(.9);
  }

  to{
    opacity:0;

    transform:
      translateY(38px)
      scale(.65);
  }
}


/* =========================================
   СЛЕДУЮЩАЯ ФОТОГРАФИЯ
========================================= */

.next-button{
  position:absolute;

  left:50%;
  bottom:22px;

  z-index:270;

  transform:
    translateX(-50%)
    translateY(10px);

  padding:
    13px 25px;

  border:0;

  border-radius:999px;

  background:
    rgba(255,250,239,.97);

  color:#5e412a;

  font-size:
    clamp(16px,1.5vw,21px);

  font-weight:800;

  box-shadow:
    0 8px 24px
    rgba(49,29,13,.22);

  cursor:pointer;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .35s ease,
    transform .35s ease;
}

.next-button.show{
  opacity:1;

  pointer-events:auto;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =========================================
   МОБИЛЬНОЕ
========================================= */

@media(max-width:800px){

  .photo-card{
    width:72vw;
  }

  .developer{
    left:2%;
  }

  .brush-wrap{
    right:2%;
  }

  .switch-wrap{
    right:15px;
  }
}

</style>
</head>


<body>

<div
  class="game"
  id="game"
>

  <div
    class="instruction"
    id="instruction"
  >
    Включи свет 💡
  </div>


  <div
    class="darkness"
    id="darkness"
  ></div>


  <div
    class="switch-wrap"
    id="switchWrap"
  >

    <div class="switch-label">
      Свет
    </div>

    <button
      class="light-switch"
      id="lightSwitch"
    >
      <span
        class="switch-button"
      ></span>
    </button>

  </div>


  <div
    class="photo-card"
    id="photoCard"
  >

    <div
      class="photo-area"
      id="photoArea"
    >

      <img
        id="photo"
        class="photo"
        src="images/capibara_1.png"
        draggable="false"
      >


      <div
        id="exposureLayer"
        class="exposure-layer"
      ></div>


      <div
        class="water-layer"
        id="waterLayer"
      >

        <img
          id="waterEdge"
          class="water-edge"
          src="water-edge.png"
          draggable="false"
        >


        <div
          id="fullWater"
          class="full-water"
        >

          <img
            class="water-shine"
            src="water-shine.png"
            draggable="false"
          >

        </div>

      </div>

    </div>

  </div>


  <img
    id="developer"
    class="developer"
    src="developer.png"
    draggable="false"
  >


  <div
    id="brushWrap"
    class="brush-wrap"
  >

    <img
      class="brush-img"
      src="brush.png"
      draggable="false"
    >

    <div
      class="wet-glow"
    ></div>

  </div>


  <button
    id="nextButton"
    class="next-button"
  >
    Следующая фотография →
  </button>

</div>


<script>

/* =========================================
   ФОТОГРАФИИ
========================================= */

const photos = [

  "images/capibara_1.png",
  "images/capibara_2.png",
  "images/capibara_3.png",
  "images/capibara_4.png",
  "images/capibara_5.png",
  "images/capibara_6.png",
  "images/capibara_7.png",
  "images/capibara_8.png"

];

let currentPhoto = 0;


/* =========================================
   ЭЛЕМЕНТЫ
========================================= */

const game =
  document.getElementById(
    "game"
  );

const instruction =
  document.getElementById(
    "instruction"
  );

const darkness =
  document.getElementById(
    "darkness"
  );

const lightSwitch =
  document.getElementById(
    "lightSwitch"
  );

const switchWrap =
  document.getElementById(
    "switchWrap"
  );

const photoCard =
  document.getElementById(
    "photoCard"
  );

const photoArea =
  document.getElementById(
    "photoArea"
  );

const photo =
  document.getElementById(
    "photo"
  );

const exposureLayer =
  document.getElementById(
    "exposureLayer"
  );

const developer =
  document.getElementById(
    "developer"
  );

const brushWrap =
  document.getElementById(
    "brushWrap"
  );

const waterLayer =
  document.getElementById(
    "waterLayer"
  );

const waterEdge =
  document.getElementById(
    "waterEdge"
  );

const fullWater =
  document.getElementById(
    "fullWater"
  );

const nextButton =
  document.getElementById(
    "nextButton"
  );


/* =========================================
   СОСТОЯНИЕ
========================================= */

let stage =
  "dark";

let dragging =
  false;

let brushWet =
  false;

let grabOffsetX =
  0;

let grabOffsetY =
  0;

let previousX =
  null;

let previousY =
  null;

let previousTime =
  null;

let paintingTime =
  0;

let paintingDistance =
  0;

let lastBlobX =
  null;

let lastBlobY =
  null;

let lastDropTime =
  0;


/* =========================================
   ИНСТРУКЦИЯ
========================================= */

function changeInstruction(text){

  instruction.classList.add(
    "hide"
  );

  setTimeout(
    () => {

      instruction.textContent =
        text;

      instruction.classList.remove(
        "hide"
      );

    },
    250
  );

}


/* =========================================
   ВКЛЮЧЕНИЕ СВЕТА
========================================= */

lightSwitch.addEventListener(
  "click",
  () => {

    if(
      stage !==
      "dark"
    ) return;


    lightSwitch.classList.add(
      "on"
    );


    darkness.classList.add(
      "off"
    );


    instruction.classList.add(
      "hide"
    );


    setTimeout(
      () => {

        photoCard.classList.add(
          "visible"
        );

      },
      400
    );


    setTimeout(
      () => {

        developer.classList.add(
          "show"
        );

        brushWrap.classList.add(
          "show"
        );


        switchWrap.style.opacity =
          "0";

        switchWrap.style.pointerEvents =
          "none";


        startPhoto();

      },
      1050
    );

  }
);


/* =========================================
   НОВАЯ ФОТОГРАФИЯ
========================================= */

function startPhoto(){

  stage =
    "dip";


  brushWet =
    false;

  dragging =
    false;

  paintingTime =
    0;

  paintingDistance =
    0;


  previousX =
    null;

  previousY =
    null;

  previousTime =
    null;

  lastBlobX =
    null;

  lastBlobY =
    null;


  exposureLayer.style.transition =
    "none";

  exposureLayer.style.opacity =
    "1";


  waterLayer
    .querySelectorAll(
      ".water-blob"
    )
    .forEach(
      blob =>
        blob.remove()
    );


  waterEdge.classList.remove(
    "spread"
  );


  fullWater.classList.remove(
    "show"
  );


  waterLayer.style.opacity =
    "1";


  photo.classList.remove(
    "developed"
  );


  brushWrap.classList.remove(
    "wet"
  );


  brushWrap.style.position =
    "absolute";

  brushWrap.style.left =
    "auto";

  brushWrap.style.top =
    "auto";

  brushWrap.style.right =
    "4%";

  brushWrap.style.bottom =
    "6%";

  brushWrap.style.opacity =
    "1";

  brushWrap.style.pointerEvents =
    "auto";

  brushWrap.style.transform =
    "rotate(-18deg)";


  nextButton.classList.remove(
    "show"
  );


  changeInstruction(
    "Обмакни кисточку в проявитель 💧"
  );

}


/* =========================================
   КОНЧИК КИСТИ
========================================= */

function getBrushTip(){

  const rect =
    brushWrap
      .getBoundingClientRect();


  return{

    x:
      rect.left +
      rect.width*.14,

    y:
      rect.top +
      rect.height*.83

  };

}


/* =========================================
   DRAG
========================================= */

brushWrap.addEventListener(
  "pointerdown",
  e => {

    if(
      stage !== "dip" &&
      stage !== "painting"
    ) return;


    e.preventDefault();


    dragging =
      true;


    brushWrap.classList.add(
      "dragging"
    );


    brushWrap.setPointerCapture(
      e.pointerId
    );


    const rect =
      brushWrap
        .getBoundingClientRect();


    grabOffsetX =
      e.clientX -
      rect.left;

    grabOffsetY =
      e.clientY -
      rect.top;


    previousX =
      e.clientX;

    previousY =
      e.clientY;

    previousTime =
      performance.now();


    brushWrap.style.position =
      "fixed";

    brushWrap.style.right =
      "auto";

    brushWrap.style.bottom =
      "auto";

    brushWrap.style.left =
      rect.left + "px";

    brushWrap.style.top =
      rect.top + "px";

  }
);


brushWrap.addEventListener(
  "pointermove",
  e => {

    if(
      !dragging
    ) return;


    const now =
      performance.now();


    const dx =
      previousX === null
      ? 0
      : e.clientX -
        previousX;


    const dy =
      previousY === null
      ? 0
      : e.clientY -
        previousY;


    brushWrap.style.left =
      (
        e.clientX -
        grabOffsetX
      ) +
      "px";


    brushWrap.style.top =
      (
        e.clientY -
        grabOffsetY
      ) +
      "px";


    const angle =
      Math.max(
        -25,
        Math.min(
          7,
          -18 +
          dx*.13
        )
      );


    brushWrap.style.transform =
      `rotate(${angle}deg)`;


    if(
      stage ===
      "dip"
    ){

      checkDip();

    }


    if(
      stage ===
      "painting" &&
      brushWet
    ){

      paintWater(
        now,
        dx,
        dy
      );

      looseDrop(
        dx,
        dy
      );

    }


    previousX =
      e.clientX;

    previousY =
      e.clientY;

    previousTime =
      now;

  }
);


brushWrap.addEventListener(
  "pointerup",
  e => {

    dragging =
      false;

    previousTime =
      null;

    brushWrap.classList.remove(
      "dragging"
    );


    try{

      brushWrap
        .releasePointerCapture(
          e.pointerId
        );

    }catch(error){}

  }
);


/* =========================================
   МАКАНИЕ В ПРОЯВИТЕЛЬ
========================================= */

function checkDip(){

  const tip =
    getBrushTip();


  const jar =
    developer
      .getBoundingClientRect();


  const inside =

    tip.x >
    jar.left +
    jar.width*.12 &&

    tip.x <
    jar.right -
    jar.width*.12 &&

    tip.y >
    jar.top &&

    tip.y <
    jar.top +
    jar.height*.48;


  if(
    inside &&
    !brushWet
  ){

    brushWet =
      true;


    stage =
      "painting";


    brushWrap.classList.add(
      "wet"
    );


    splash(
      tip.x,
      tip.y
    );


    changeInstruction(
      "Нанеси проявитель на фотографию 🖌️"
    );

  }

}


/* =========================================
   ВСПЛЕСК
========================================= */

function splash(x,y){

  for(
    let i=0;
    i<4;
    i++
  ){

    createDrop(

      x +
      (Math.random()-.5)*26,

      y +
      Math.random()*5

    );

  }

}


/* =========================================
   МАЛЕНЬКИЕ КАПЛИ
========================================= */

function createDrop(x,y){

  const drop =
    document.createElement(
      "div"
    );


  drop.className =
    "falling-drop";


  drop.style.left =
    x + "px";

  drop.style.top =
    y + "px";


  game.appendChild(
    drop
  );


  setTimeout(
    () =>
      drop.remove(),
    800
  );

}


/* =========================================
   КАПЛЯ МОЖЕТ СОРВАТЬСЯ ПРИ ДВИЖЕНИИ
========================================= */

function looseDrop(
  dx,
  dy
){

  const now =
    performance.now();


  const speed =
    Math.sqrt(
      dx*dx +
      dy*dy
    );


  if(
    speed > 6 &&
    now -
    lastDropTime >
    600 &&
    Math.random() <
    .20
  ){

    lastDropTime =
      now;


    const tip =
      getBrushTip();


    createDrop(
      tip.x,
      tip.y
    );

  }

}


/* =========================================
   НАНОСИМ ВОДУ
========================================= */

function paintWater(
  now,
  dx,
  dy
){

  const tip =
    getBrushTip();


  const rect =
    photoArea
      .getBoundingClientRect();


  const inside =

    tip.x >= rect.left &&
    tip.x <= rect.right &&

    tip.y >= rect.top &&
    tip.y <= rect.bottom;


  if(
    !inside
  ){

    previousTime =
      now;

    return;
  }


  const x =
    tip.x -
    rect.left;


  const y =
    tip.y -
    rect.top;


  if(
    previousTime !== null
  ){

    paintingTime +=
      Math.min(
        60,
        now -
        previousTime
      );

  }


  paintingDistance +=
    Math.sqrt(
      dx*dx +
      dy*dy
    );


  let shouldBlob =
    false;


  if(
    lastBlobX === null
  ){

    shouldBlob =
      true;

  }else{

    const distance =
      Math.hypot(
        x-lastBlobX,
        y-lastBlobY
      );


    if(
      distance >
      28
    ){

      shouldBlob =
        true;

    }

  }


  if(
    shouldBlob
  ){

    createWaterBlob(
      x,
      y,
      dx,
      dy
    );


    lastBlobX =
      x;

    lastBlobY =
      y;

  }


  if(
    paintingTime >=
    1800 &&
    paintingDistance >=
    280
  ){

    beginFlood();

  }

}


/* =========================================
   WATER BLOB
========================================= */

function createWaterBlob(
  x,
  y,
  dx,
  dy
){

  const blob =
    document.createElement(
      "img"
    );


  blob.src =
    "water-blob.png";


  blob.className =
    "water-blob";


  blob.style.left =
    x + "px";


  blob.style.top =
    y + "px";


  const size =
    105 +
    Math.random()*70;


  blob.style.width =
    size + "px";


  const angle =
    Math.atan2(
      dy,
      dx
    ) *
    180 /
    Math.PI;


  blob.style.rotate =
    (
      angle +
      (Math.random()-.5)*16
    ) +
    "deg";


  waterLayer.insertBefore(
    blob,
    waterEdge
  );

}


/* =========================================
   РАСТЕКАНИЕ
========================================= */

function beginFlood(){

  if(
    stage !==
    "painting"
  ) return;


  stage =
    "spreading";


  dragging =
    false;


  brushWrap.style.pointerEvents =
    "none";


  changeInstruction(
    "Раствор растекается по фотографии..."
  );


  waterEdge.classList.remove(
    "spread"
  );


  void waterEdge.offsetWidth;


  waterEdge.classList.add(
    "spread"
  );


  const spots = [

    [.25,.25],
    [.72,.28],
    [.38,.65],
    [.72,.70],
    [.50,.45]

  ];


  spots.forEach(
    (
      point,
      index
    ) => {

      setTimeout(
        () => {

          const x =
            photoArea.clientWidth *
            point[0];


          const y =
            photoArea.clientHeight *
            point[1];


          createLargeBlob(
            x,
            y
          );

        },
        150 +
        index*170
      );

    }
  );


  setTimeout(
    () => {

      fullWater.classList.add(
        "show"
      );

    },
    850
  );


  setTimeout(
    () => {

      brushWrap.style.opacity =
        "0";

    },
    1150
  );


  setTimeout(
    () => {

      stage =
        "ready";


      changeInstruction(
        "Готово! Нажми на фотографию 📸"
      );

    },
    1800
  );

}


/* =========================================
   КРУПНЫЕ ПЯТНА
========================================= */

function createLargeBlob(
  x,
  y
){

  const blob =
    document.createElement(
      "img"
    );


  blob.src =
    "water-blob.png";


  blob.className =
    "water-blob";


  blob.style.left =
    x + "px";


  blob.style.top =
    y + "px";


  blob.style.width =
    (
      220 +
      Math.random()*130
    ) +
    "px";


  blob.style.rotate =
    (
      Math.random()*360
    ) +
    "deg";


  waterLayer.insertBefore(
    blob,
    waterEdge
  );

}


/* =========================================
   ПРОЯВЛЕНИЕ
========================================= */

photoCard.addEventListener(
  "click",
  () => {

    if(
      stage !==
      "ready"
    ) return;


    stage =
      "developed";


    instruction.classList.add(
      "hide"
    );


    waterLayer.style.opacity =
      "0";


    exposureLayer.style.transition =
      "opacity 1.8s ease";


    exposureLayer.style.opacity =
      "0";


    setTimeout(
      () => {

        photo.classList.add(
          "developed"
        );

      },
      180
    );


    setTimeout(
      () => {

        /*
          Если ещё есть фотографии —
          показываем кнопку.

          Если это последняя —
          финальный текст появляется СВЕРХУ.
        */

        if(
          currentPhoto <
          photos.length - 1
        ){

          nextButton.classList.add(
            "show"
          );

        }else{

          instruction.textContent =
            "Спасибо, что помог проявить все фотографии! ✨";


          instruction.classList.remove(
            "hide"
          );

        }

      },
      2100
    );

  }
);


/* =========================================
   СЛЕДУЮЩАЯ ФОТОГРАФИЯ
========================================= */

nextButton.addEventListener(
  "click",
  e => {

    e.stopPropagation();


    if(
      currentPhoto >=
      photos.length - 1
    ) return;


    nextButton.classList.remove(
      "show"
    );


    instruction.classList.add(
      "hide"
    );


    /*
      Сначала закрываем старое фото,
      чтобы новую капибару
      нельзя было подсмотреть.
    */

    exposureLayer.style.transition =
      "none";


    exposureLayer.style.opacity =
      "1";


    photoCard.style.opacity =
      "0";


    setTimeout(
      () => {

        currentPhoto++;


        photo.src =
          photos[
            currentPhoto
          ];


        photo.classList.remove(
          "developed"
        );


        waterLayer.style.opacity =
          "1";


        waterLayer
          .querySelectorAll(
            ".water-blob"
          )
          .forEach(
            blob =>
              blob.remove()
          );


        waterEdge.classList.remove(
          "spread"
        );


        fullWater.classList.remove(
          "show"
        );


        photoCard.style.opacity =
          "1";


        preloadPhoto(
          currentPhoto + 1
        );


        startPhoto();

      },
      450
    );

  }
);


/* =========================================
   PRELOAD
========================================= */

function preloadPhoto(index){

  if(
    index < 0 ||
    index >= photos.length
  ) return;


  const image =
    new Image();


  image.src =
    photos[index];

}


/* =========================================
   START
========================================= */

window.addEventListener(
  "load",
  () => {

    preloadPhoto(0);
    preloadPhoto(1);


    [
      "water-blob.png",
      "water-edge.png",
      "water-shine.png",
      "brush.png",
      "developer.png"
    ]
    .forEach(
      src => {

        const image =
          new Image();

        image.src =
          src;

      }
    );

  }
);

</script>
