<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Фотостудия капибары</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial, Helvetica, sans-serif;

  background:
    radial-gradient(
      circle at 50% 25%,
      #fff8eb 0%,
      #f0ddc2 56%,
      #d8b98f 100%
    );
}


/* =========================
   ИГРА
========================= */

.game{
  position:relative;

  width:100vw;
  height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}


/* =========================
   ТЕМНОТА
========================= */

.darkness{
  position:absolute;
  inset:0;

  z-index:30;

  background:
    rgba(8,10,14,0.94);

  pointer-events:none;

  transition:
    opacity 1.4s ease;
}

.darkness.off{
  opacity:0;
}


/* =========================
   ИНСТРУКЦИЯ
========================= */

.instruction{
  position:absolute;

  left:50%;
  top:28px;

  z-index:80;

  transform:
    translateX(-50%);

  padding:
    12px 22px;

  border-radius:18px;

  background:
    rgba(255,255,255,0.95);

  color:#6d4d31;

  font-size:
    clamp(18px,2vw,28px);

  font-weight:800;

  text-align:center;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,0.16);

  transition:
    opacity .35s ease,
    transform .35s ease;
}

.instruction.hide{
  opacity:0;

  transform:
    translateX(-50%)
    translateY(-8px);
}


/* =========================
   ВЫКЛЮЧАТЕЛЬ
========================= */

.switch-wrap{
  position:absolute;

  right:40px;
  top:50%;

  transform:
    translateY(-50%);

  z-index:90;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:8px;

  transition:
    opacity .45s ease;
}

.switch-label{
  color:white;

  font-size:15px;

  text-shadow:
    0 2px 5px
    rgba(0,0,0,.7);
}

.light-switch{
  position:relative;

  width:72px;
  height:108px;

  border:0;

  border-radius:12px;

  background:#eee8dc;

  cursor:pointer;

  box-shadow:
    0 8px 22px
    rgba(0,0,0,.4),
    inset 0 0 0 2px
    rgba(90,80,65,.12);
}

.switch-button{
  position:absolute;

  left:17px;
  top:16px;

  width:38px;
  height:75px;

  border-radius:6px;

  background:
    linear-gradient(
      180deg,
      #faf8f1,
      #cbc4b7
    );

  box-shadow:
    0 4px 8px
    rgba(0,0,0,.28);

  transition:
    transform .3s ease,
    background .3s ease;
}

.light-switch.on .switch-button{
  transform:
    translateY(12px);

  background:
    linear-gradient(
      180deg,
      #ffe8a5,
      #e6ba52
    );
}


/* =========================
   ФОТОРАМКА
========================= */

.photo-card{
  position:relative;

  width:
    min(70vw,820px);

  aspect-ratio:4/3;

  padding:
    14px 14px 48px;

  background:#fff;

  border-radius:10px;

  box-shadow:
    0 25px 65px
    rgba(78,49,24,.26);

  opacity:0;

  transform:
    scale(.97);

  transition:
    opacity .7s ease,
    transform .7s ease;

  cursor:pointer;
}

.photo-card.visible{
  opacity:1;

  transform:
    scale(1);
}

.photo-area{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  border-radius:4px;

  background:#eadcc8;

  touch-action:none;
}

.photo{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  pointer-events:none;
  user-select:none;

  filter:
    grayscale(.78)
    sepia(.22)
    blur(8px)
    brightness(1.42)
    contrast(.72)
    saturate(.34);

  opacity:.64;

  transform:
    scale(1.03);

  transition:
    filter 2.2s cubic-bezier(.22,.8,.3,1),
    opacity 2.2s ease,
    transform 2.2s cubic-bezier(.22,.8,.3,1);
}

.photo.developed{
  filter:
    grayscale(0)
    sepia(0)
    blur(0)
    brightness(1)
    contrast(1)
    saturate(1);

  opacity:1;

  transform:
    scale(1);
}


/* =========================
   ВОДЯНОЙ РАСТВОР
========================= */

#liquidCanvas{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  pointer-events:none;

  transition:
    opacity 1.2s ease,
    filter .8s ease;
}


/* =========================
   ИНСТРУМЕНТЫ
========================= */

.tools{
  position:absolute;

  left:35px;
  bottom:35px;

  z-index:60;

  display:flex;
  align-items:flex-end;

  gap:20px;

  opacity:0;

  pointer-events:none;

  transform:
    translateY(15px);

  transition:
    opacity .45s ease,
    transform .45s ease;
}

.tools.show{
  opacity:1;

  transform:
    translateY(0);
}

.jar{
  width:88px;

  padding:
    11px 9px 13px;

  border-radius:
    8px 8px 14px 14px;

  background:
    linear-gradient(
      180deg,
      #eaf7fb,
      #cfe8ee
    );

  border:
    3px solid
    rgba(80,110,120,.3);

  color:#41636c;

  text-align:center;

  font-weight:800;

  box-shadow:
    0 8px 18px
    rgba(50,80,90,.18);
}

.jar::before{
  content:"";

  display:block;

  width:64px;
  height:12px;

  margin:
    -20px auto
    10px;

  border-radius:5px;

  background:#6d8990;
}

.jar-small{
  margin-top:4px;

  font-size:11px;

  opacity:.7;
}


/* =========================
   КИСТОЧКА
========================= */

.brush{
  position:relative;

  width:110px;
  height:48px;

  pointer-events:auto;

  cursor:grab;

  touch-action:none;

  transform:
    rotate(-18deg);

  transition:
    opacity .35s ease;
}

.brush:active{
  cursor:grabbing;
}

.brush-handle{
  position:absolute;

  right:0;
  top:17px;

  width:78px;
  height:14px;

  border-radius:999px;

  background:
    linear-gradient(
      180deg,
      #9b663c,
      #704326
    );
}

.brush-metal{
  position:absolute;

  left:23px;
  top:13px;

  width:32px;
  height:23px;

  border-radius:4px;

  background:
    linear-gradient(
      90deg,
      #a69b8c,
      #ded8ce,
      #95897b
    );
}

.brush-bristles{
  position:absolute;

  left:0;
  top:10px;

  width:32px;
  height:29px;

  border-radius:
    14px 4px 4px 14px;

  background:
    linear-gradient(
      90deg,
      #e1c58e,
      #b88d5c
    );
}


/* =========================
   ВСПЫШКА
========================= */

.flash{
  position:absolute;
  inset:0;

  z-index:15;

  background:
    rgba(255,249,220,0);

  pointer-events:none;
}

.flash.active{
  animation:
    flashAnim .85s ease;
}

@keyframes flashAnim{

  0%{
    background:
      rgba(255,249,220,0);
  }

  35%{
    background:
      rgba(255,249,220,.72);
  }

  100%{
    background:
      rgba(255,249,220,0);
  }

}


/* =========================
   КНОПКА ДАЛЬШЕ
========================= */

.next-button{
  position:absolute;

  left:50%;
  bottom:28px;

  z-index:100;

  transform:
    translateX(-50%)
    translateY(12px);

  padding:
    13px 24px;

  border:0;

  border-radius:999px;

  background:
    #ffffff;

  color:#6d4d31;

  font-size:
    clamp(16px,1.6vw,21px);

  font-weight:800;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.18);

  cursor:pointer;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .4s ease,
    transform .4s ease;
}

.next-button.show{
  opacity:1;

  pointer-events:auto;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =========================
   ФИНАЛ
========================= */

.success{
  position:absolute;

  left:50%;
  top:50%;

  z-index:110;

  transform:
    translate(-50%,-50%)
    scale(.8);

  padding:
    17px 28px;

  border-radius:20px;

  background:
    rgba(255,255,255,.96);

  color:#704b28;

  font-size:
    clamp(23px,3vw,38px);

  font-weight:800;

  box-shadow:
    0 14px 42px
    rgba(0,0,0,.22);

  opacity:0;

  pointer-events:none;

  transition:
    opacity .4s ease,
    transform .4s ease;
}

.success.show{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1);
}


@media(max-width:700px){

  .switch-wrap{
    right:14px;
  }

  .photo-card{
    width:86vw;
  }

  .tools{
    left:14px;
    bottom:16px;

    transform:
      scale(.85);
  }

}

</style>
</head>


<body>

<div class="game">

  <div
    class="instruction"
    id="instruction"
  >
    Включи свет 💡
  </div>


  <div
    class="darkness"
    id="darkness"
  ></div>


  <div
    class="switch-wrap"
    id="switchWrap"
  >

    <div class="switch-label">
      Свет
    </div>

    <button
      class="light-switch"
      id="lightSwitch"
    >

      <span
        class="switch-button"
      ></span>

    </button>

  </div>


  <div
    class="photo-card"
    id="photoCard"
  >

    <div
      class="photo-area"
      id="photoArea"
    >

      <img
        id="photo"
        class="photo"
        src="images/capibara_1.png"
        alt="Капибара"
        draggable="false"
      >

      <canvas
        id="liquidCanvas"
      ></canvas>

      <div
        class="flash"
        id="flash"
      ></div>

    </div>

  </div>


  <div
    class="tools"
    id="tools"
  >

    <div class="jar">
      ПРОЯВИТЕЛЬ

      <div class="jar-small">
        раствор
      </div>
    </div>


    <div
      class="brush"
      id="brush"
    >

      <div
        class="brush-bristles"
      ></div>

      <div
        class="brush-metal"
      ></div>

      <div
        class="brush-handle"
      ></div>

    </div>

  </div>


  <button
    class="next-button"
    id="nextButton"
  >
    Следующая фотография →
  </button>


  <div
    class="success"
    id="success"
  >
    ✨ Все фотографии готовы! ✨
  </div>

</div>


<script>

/* =========================
   ФОТОГРАФИИ

   ПОРЯДОК ЖЁСТКО ЗАДАН
========================= */

const photos = [

  "images/capibara_1.png",
  "images/capibara_2.png",
  "images/capibara_3.png",
  "images/capibara_4.png",
  "images/capibara_5.png",
  "images/capibara_6.png",
  "images/capibara_7.png",
  "images/capibara_8.png"

];


let currentPhoto = 0;


/* =========================
   ЭЛЕМЕНТЫ
========================= */

const lightSwitch =
  document.getElementById(
    "lightSwitch"
  );

const darkness =
  document.getElementById(
    "darkness"
  );

const instruction =
  document.getElementById(
    "instruction"
  );

const switchWrap =
  document.getElementById(
    "switchWrap"
  );

const photoCard =
  document.getElementById(
    "photoCard"
  );

const photoArea =
  document.getElementById(
    "photoArea"
  );

const photo =
  document.getElementById(
    "photo"
  );

const tools =
  document.getElementById(
    "tools"
  );

const brush =
  document.getElementById(
    "brush"
  );

const canvas =
  document.getElementById(
    "liquidCanvas"
  );

const ctx =
  canvas.getContext(
    "2d"
  );

const flash =
  document.getElementById(
    "flash"
  );

const nextButton =
  document.getElementById(
    "nextButton"
  );

const success =
  document.getElementById(
    "success"
  );


/* =========================
   СОСТОЯНИЕ
========================= */

let stage =
  "dark";

let W = 1;
let H = 1;
let DPR = 1;


/*
  Примерно 2 секунды кисточкой
  по самой фотографии.
*/

const REQUIRED_BRUSH_TIME =
  2000;

let brushActiveTime =
  0;

let lastBrushFrameTime =
  null;


/* =========================
   CANVAS
========================= */

function resizeCanvas(){

  const rect =
    photoArea.getBoundingClientRect();

  W =
    rect.width;

  H =
    rect.height;

  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.round(
      W * DPR
    );

  canvas.height =
    Math.round(
      H * DPR
    );

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );
}


/* =========================
   ИНСТРУКЦИЯ
========================= */

function changeInstruction(text){

  instruction.classList.add(
    "hide"
  );

  setTimeout(
    () => {

      instruction.textContent =
        text;

      instruction.classList.remove(
        "hide"
      );

    },
    260
  );
}


/* =========================
   СВЕТ
========================= */

lightSwitch.addEventListener(
  "click",
  () => {

    if(
      stage !==
      "dark"
    ) return;


    lightSwitch.classList.add(
      "on"
    );


    darkness.classList.add(
      "off"
    );


    instruction.classList.add(
      "hide"
    );


    setTimeout(
      () => {

        photoCard.classList.add(
          "visible"
        );

      },
      450
    );


    setTimeout(
      () => {

        switchWrap.style.opacity =
          "0";

        switchWrap.style.pointerEvents =
          "none";


        beginBrushStage();

      },
      1050
    );

  }
);


/* =========================
   НАЧАТЬ ОБРАБОТКУ ФОТО
========================= */

function beginBrushStage(){

  stage =
    "brush";


  brushActiveTime =
    0;

  lastBrushFrameTime =
    null;


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  canvas.style.transition =
    "none";

  canvas.style.opacity =
    "1";

  canvas.style.filter =
    "none";


  photo.classList.remove(
    "developed"
  );


  tools.classList.add(
    "show"
  );

  tools.style.pointerEvents =
    "auto";


  brush.style.opacity =
    "1";

  brush.style.pointerEvents =
    "auto";


  nextButton.classList.remove(
    "show"
  );


  changeInstruction(
    "Нанеси проявитель кисточкой 🖌️"
  );

}


/* =========================
   ПОЛОЖЕНИЕ НА ФОТО
========================= */

function localPhotoPosition(
  clientX,
  clientY
){

  const rect =
    photoArea.getBoundingClientRect();


  return{

    x:
      clientX -
      rect.left,

    y:
      clientY -
      rect.top,

    inside:

      clientX >=
      rect.left &&

      clientX <=
      rect.right &&

      clientY >=
      rect.top &&

      clientY <=
      rect.bottom

  };
}


/* =========================
   ВОДА
========================= */

function paintLiquid(
  x,
  y
){

  const radius =
    38;


  const gradient =
    ctx.createRadialGradient(
      x,
      y,
      0,
      x,
      y,
      radius
    );


  gradient.addColorStop(
    0,
    "rgba(225,245,255,.22)"
  );


  gradient.addColorStop(
    .42,
    "rgba(210,235,248,.14)"
  );


  gradient.addColorStop(
    .78,
    "rgba(245,252,255,.07)"
  );


  gradient.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );


  ctx.fillStyle =
    gradient;


  ctx.beginPath();


  ctx.arc(
    x,
    y,
    radius,
    0,
    Math.PI*2
  );


  ctx.fill();


  /*
    Световой блик
  */

  ctx.fillStyle =
    "rgba(255,255,255,.15)";


  ctx.beginPath();


  ctx.ellipse(
    x-8,
    y-9,
    16,
    4,
    -.35,
    0,
    Math.PI*2
  );


  ctx.fill();

}


/* =========================
   DRAG КИСТОЧКИ
========================= */

let dragging =
  false;

let pointerId =
  null;

let grabOffsetX =
  0;

let grabOffsetY =
  0;


brush.addEventListener(
  "pointerdown",
  e => {

    if(
      stage !==
      "brush"
    ) return;


    e.preventDefault();


    dragging =
      true;


    pointerId =
      e.pointerId;


    brush.setPointerCapture(
      e.pointerId
    );


    const rect =
      brush.getBoundingClientRect();


    grabOffsetX =
      e.clientX -
      rect.left;

    grabOffsetY =
      e.clientY -
      rect.top;


    brush.style.position =
      "fixed";

    brush.style.left =
      rect.left + "px";

    brush.style.top =
      rect.top + "px";

    brush.style.zIndex =
      "100";


    lastBrushFrameTime =
      performance.now();

  }
);


brush.addEventListener(
  "pointermove",
  e => {

    if(
      !dragging ||
      stage !==
      "brush"
    ) return;


    brush.style.left =
      (
        e.clientX -
        grabOffsetX
      ) +
      "px";


    brush.style.top =
      (
        e.clientY -
        grabOffsetY
      ) +
      "px";


    const p =
      localPhotoPosition(
        e.clientX,
        e.clientY
      );


    const now =
      performance.now();


    if(
      !p.inside
    ){

      lastBrushFrameTime =
        now;

      return;
    }


    paintLiquid(
      p.x,
      p.y
    );


    if(
      lastBrushFrameTime !==
      null
    ){

      brushActiveTime +=
        now -
        lastBrushFrameTime;

    }


    lastBrushFrameTime =
      now;


    if(
      brushActiveTime >=
      REQUIRED_BRUSH_TIME
    ){

      spreadLiquidOverPhoto();

    }

  }
);


brush.addEventListener(
  "pointerup",
  () => {

    dragging =
      false;

    lastBrushFrameTime =
      null;


    if(
      pointerId !==
      null
    ){

      try{

        brush.releasePointerCapture(
          pointerId
        );

      }catch(err){}

    }


    pointerId =
      null;

  }
);


brush.addEventListener(
  "pointercancel",
  () => {

    dragging =
      false;

    pointerId =
      null;

    lastBrushFrameTime =
      null;

  }
);


/* =========================
   РАСТЕКАНИЕ
========================= */

function spreadLiquidOverPhoto(){

  if(
    stage !==
    "brush"
  ) return;


  stage =
    "spreading";


  dragging =
    false;


  brush.style.pointerEvents =
    "none";


  changeInstruction(
    "Раствор растекается по фотографии..."
  );


  const start =
    performance.now();


  const duration =
    1200;


  function animateSpread(now){

    const t =
      Math.min(
        1,
        (
          now -
          start
        ) /
        duration
      );


    const ease =
      1 -
      Math.pow(
        1-t,
        3
      );


    ctx.save();


    ctx.fillStyle =
      `rgba(
        210,
        235,
        248,
        ${0.012 + 0.05*ease}
      )`;


    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    for(
      let i=0;
      i<6;
      i++
    ){

      const y =
        H *
        (
          .10 +
          i*.16
        );


      const gradient =
        ctx.createLinearGradient(
          0,
          y,
          W,
          y+35
        );


      gradient.addColorStop(
        0,
        "rgba(255,255,255,0)"
      );


      gradient.addColorStop(
        .5,
        `rgba(
          255,
          255,
          255,
          ${.02 + .05*ease}
        )`
      );


      gradient.addColorStop(
        1,
        "rgba(255,255,255,0)"
      );


      ctx.fillStyle =
        gradient;


      ctx.fillRect(
        0,
        y,
        W,
        26
      );

    }


    ctx.restore();


    if(
      t < 1
    ){

      requestAnimationFrame(
        animateSpread
      );

    }else{

      stage =
        "ready";


      brush.style.opacity =
        ".25";


      tools.style.pointerEvents =
        "none";


      canvas.style.filter =
        "blur(1.5px)";


      changeInstruction(
        "Готово! Нажми на фотографию 📸"
      );

    }

  }


  requestAnimationFrame(
    animateSpread
  );

}


/* =========================
   ПРОЯВЛЕНИЕ
========================= */

photoCard.addEventListener(
  "click",
  () => {

    if(
      stage !==
      "ready"
    ) return;


    stage =
      "developed";


    instruction.classList.add(
      "hide"
    );


    tools.classList.remove(
      "show"
    );


    canvas.style.transition =
      "opacity 1.25s ease";

    canvas.style.opacity =
      "0";


    flash.classList.remove(
      "active"
    );


    void flash.offsetWidth;


    flash.classList.add(
      "active"
    );


    photo.classList.add(
      "developed"
    );


    setTimeout(
      () => {

        if(
          currentPhoto <
          photos.length - 1
        ){

          nextButton.textContent =
            "Следующая фотография →";


          nextButton.classList.add(
            "show"
          );

        }else{

          success.classList.add(
            "show"
          );

        }

      },
      2000
    );

  }
);


/* =========================
   СЛЕДУЮЩАЯ ФОТОГРАФИЯ
========================= */

nextButton.addEventListener(
  "click",
  e => {

    e.stopPropagation();


    if(
      currentPhoto >=
      photos.length - 1
    ) return;


    nextButton.classList.remove(
      "show"
    );


    instruction.classList.add(
      "hide"
    );


    /*
      Фото слегка исчезает,
      чтобы смена выглядела аккуратно.
    */

    photoCard.style.opacity =
      "0";


    setTimeout(
      () => {

        currentPhoto++;


        photo.src =
          photos[
            currentPhoto
          ];


        photo.classList.remove(
          "developed"
        );


        ctx.clearRect(
          0,
          0,
          W,
          H
        );


        canvas.style.transition =
          "none";

        canvas.style.opacity =
          "1";

        canvas.style.filter =
          "none";


        photoCard.style.opacity =
          "1";


        /*
          Новая фотография —
          снова берём проявитель.
        */

        beginBrushStage();

      },
      550
    );

  }
);


/* =========================
   START
========================= */

window.addEventListener(
  "load",
  () => {

    resizeCanvas();

    /*
      Предварительно загружаем
      остальные картинки,
      чтобы между ними не было паузы.
    */

    photos.forEach(
      src => {

        const img =
          new Image();

        img.src =
          src;

      }
    );

  }
);


if(
  window.ResizeObserver
){

  new ResizeObserver(
    resizeCanvas
  ).observe(
    photoArea
  );

}

</script>

</body>
</html>
